<meta property="og:title" content="260427 스도쿠(시계)">
<meta property="og:description" content="격자에 주어진 디지털 시계 안에는 HH:MM 형식의 시간으로 표시할 수 있는 숫자가 들어가야 합니다">

<style>
  .board-wrap {
    border: 2.5px solid #222;
    position: relative;
    margin-top: 20px;
    overflow: visible;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: min(6.2vw, 28px);
    font-weight: 700;
    background: #fff;
    color: #4a6fa5;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    border-right: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
    position: relative;
  }

  .cell:nth-child(9n) { border-right: none; }
  .cell:nth-child(n+73) { border-bottom: none; }
  .cell.box-right { border-right: 2.5px solid #222; }
  .cell.box-bottom { border-bottom: 2.5px solid #222; }
  .cell.given { color: #222; }
  .cell.selected { background: #e8e8d8 !important; }
  .cell.error { background: #f5d0d0 !important; color: #c0392b !important; }
  .cell.given.error { color: #c0392b !important; }
  .cell:hover:not(.selected):not(.error) { background: #f5f5f0; }

  .clock {
    position: absolute;
    height: calc(100% / 9 * 0.82);
    width: calc(100% / 9 * 4 - 6px);
    border: 2px solid #222;
    border-radius: 10px;
    background: transparent;
    z-index: 8;
    pointer-events: none;
  }

  .clock-colon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 34px;
    transform: translate(-50%, -50%);
  }

  .clock-colon::before,
  .clock-colon::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #111;
    transform: translateX(-50%);
  }

  .clock-colon::before { top: 4px; }
  .clock-colon::after { bottom: 4px; }

  .numpad {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .numpad button {
    flex: 1;
    height: 44px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    font-weight: 700;
    border: 1.5px solid #c8c3b8;
    border-radius: 3px;
    background: #f4f1eb;
    color: #333;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }

  .numpad button:hover { background: #e8e4da; }
  .numpad button:active { transform: scale(0.95); background: #ddd9cf; }

  @media (max-width: 540px) {
    body { padding: 0 8px 40px; }
    h1 { font-size: 1.25rem; }
    .numpad { gap: 5px; }
    .numpad button {
      height: min(9.5vw, 44px);
      font-size: min(4.4vw, 18px);
    }
    .bottom-buttons { gap: 5px; }
    .bottom-buttons button {
      height: min(8.5vw, 40px);
      font-size: min(3.2vw, 13px);
    }

    .clock {
      width: calc(100% / 9 * 4 - 5px);
      height: calc(100% / 9 * 0.82);
      border-width: 1.5px;
      border-radius: 8px;
    }

    .clock-colon {
      width: 10px;
      height: 28px;
    }

    .clock-colon::before,
    .clock-colon::after {
      width: 8px;
      height: 8px;
    }
  }
</style>

<body class="puzzle-page pad-48">

<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>260427 스도쿠(시계)</h1>
<p class="subtitle">시계 안의 네 칸이 HH:MM으로 가능한 시간이 되게 스도쿠를 완성하세요</p>

<div class="container puzzle-width-md align-stretch">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <strong>시계 스도쿠 규칙</strong><br>
    1. 기본적인 스도쿠 규칙을 따릅니다.<br>
    2. 격자에 주어진 디지털 시계 안에는 HH:MM 형식의 시간으로 표시할 수 있는 숫자가 들어가야 합니다.<br>
    3. 시간은 00:00~23:59 까지 가능한 것으로 간주합니다.
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="numpad" id="numpad"></div>

  <div class="bottom-buttons">
    <button onclick="placeNumber(0)">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>

  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>

  <div class="message" id="message"></div>

  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const PUZZLE_ID = '260427_01';
const SAVE_KEY = 'puzzle_260427_01';

const PRESET_GRID = [
  [0,0,0,0,0,0,2,6,0],
  [0,0,0,0,0,7,0,0,3],
  [0,6,0,0,0,0,0,0,7],
  [0,0,5,0,0,0,0,0,0],
  [0,0,0,9,0,3,0,0,0],
  [0,0,0,0,0,0,8,0,0],
  [5,0,0,0,0,0,0,3,0],
  [9,0,0,6,0,0,0,0,0],
  [0,1,7,0,0,0,0,0,0]
];

const CLOCKS = [
  [1, 0],
  [2, 2],
  [3, 4],
  [5, 1],
  [6, 3],
  [7, 5]
];

const VALID_CLOCKS = [];
for (let hour = 0; hour <= 23; hour += 1) {
  for (let minute = 0; minute <= 59; minute += 1) {
    const digits = `${hour}`.padStart(2, '0') + `${minute}`.padStart(2, '0');
    if ([...digits].every(ch => ch !== '0')) VALID_CLOCKS.push(digits);
  }
}

const PRESETS = [];
PRESET_GRID.forEach((row, r) => row.forEach((v, c) => { if (v) PRESETS.push([r, c, v]); }));

let board = PRESET_GRID.map(row => [...row]);
const GIVEN = new Set(PRESETS.map(([r, c]) => `${r},${c}`));
let sel = null;

function buildGrid() {
  const boardEl = document.getElementById('board');
  for (let r = 0; r < 9; r += 1) {
    for (let c = 0; c < 9; c += 1) {
      const cell = document.createElement('div');
      cell.className = 'cell'
        + (GIVEN.has(`${r},${c}`) ? ' given' : '')
        + (c === 2 || c === 5 ? ' box-right' : '')
        + (r === 2 || r === 5 ? ' box-bottom' : '');
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', () => {
        sel = [r, c];
        renderBoard();
      });
      boardEl.appendChild(cell);
    }
  }

  CLOCKS.forEach(([r, c]) => {
    const clock = document.createElement('div');
    clock.className = 'clock';
    clock.style.left = `calc(${(c / 9) * 100}% + 2px)`;
    clock.style.top = `calc(${(r / 9) * 100}% + (100% / 9 * 0.09))`;
    const colon = document.createElement('span');
    colon.className = 'clock-colon';
    clock.appendChild(colon);
    boardEl.parentElement.appendChild(clock);
  });
}

function isClockImpossible(values) {
  return !VALID_CLOCKS.some(time =>
    values.every((v, index) => v === 0 || Number(time[index]) === v)
  );
}

function getConflicts() {
  const set = new Set();

  for (let r = 0; r < 9; r += 1) {
    const seen = new Map();
    for (let c = 0; c < 9; c += 1) {
      const v = board[r][c];
      if (!v) continue;
      if (seen.has(v)) {
        set.add(`${r},${c}`);
        set.add(`${r},${seen.get(v)}`);
      } else {
        seen.set(v, c);
      }
    }
  }

  for (let c = 0; c < 9; c += 1) {
    const seen = new Map();
    for (let r = 0; r < 9; r += 1) {
      const v = board[r][c];
      if (!v) continue;
      if (seen.has(v)) {
        set.add(`${r},${c}`);
        set.add(`${seen.get(v)},${c}`);
      } else {
        seen.set(v, r);
      }
    }
  }

  for (let br = 0; br < 3; br += 1) {
    for (let bc = 0; bc < 3; bc += 1) {
      const seen = new Map();
      for (let dr = 0; dr < 3; dr += 1) {
        for (let dc = 0; dc < 3; dc += 1) {
          const r = br * 3 + dr;
          const c = bc * 3 + dc;
          const v = board[r][c];
          if (!v) continue;
          if (seen.has(v)) {
            set.add(`${r},${c}`);
            set.add(seen.get(v));
          } else {
            seen.set(v, `${r},${c}`);
          }
        }
      }
    }
  }

  CLOCKS.forEach(([r, c]) => {
    const values = [board[r][c], board[r][c + 1], board[r][c + 2], board[r][c + 3]];
    if (values.every(v => v === 0)) return;
    if (isClockImpossible(values)) {
      values.forEach((v, index) => {
        if (v) set.add(`${r},${c + index}`);
      });
    }
  });

  return set;
}

function renderBoard() {
  const conflicts = getConflicts();
  document.querySelectorAll('.cell').forEach(cell => {
    const r = Number(cell.dataset.r);
    const c = Number(cell.dataset.c);
    const key = `${r},${c}`;
    cell.textContent = board[r][c] || '';
    cell.classList.toggle('selected', !!sel && sel[0] === r && sel[1] === c);
    cell.classList.toggle('error', conflicts.has(key));
  });
}

function placeNumber(v) {
  if (!sel) return;
  const [r, c] = sel;
  if (GIVEN.has(`${r},${c}`)) return;
  board[r][c] = v;
  saveProgress();
  renderBoard();
  checkComplete();
}

function buildNumpad() {
  const numpad = document.getElementById('numpad');
  for (let i = 1; i <= 9; i += 1) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.addEventListener('click', () => placeNumber(i));
    numpad.appendChild(btn);
  }
}

function isComplete() {
  if (!board.every(row => row.every(v => v > 0))) return false;
  return getConflicts().size === 0;
}

function checkComplete() {
  const msg = document.getElementById('message');
  if (!isComplete()) {
    msg.textContent = '';
    return;
  }
  msg.textContent = '축하합니다! 퍼즐을 완성했습니다!';
  recordCompletion(PUZZLE_ID);
}

function saveProgress() {
  saveLocalState(SAVE_KEY, board);
}

function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (!Array.isArray(saved) || saved.length !== 9) return;
  board = saved;
  PRESETS.forEach(([r, c, v]) => { board[r][c] = v; });
}

async function handleCloudSave() {
  await saveProgressCloud(PUZZLE_ID, board);
}

async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== 9) return;
    board = state;
    PRESETS.forEach(([r, c, v]) => { board[r][c] = v; });
    renderBoard();
    saveProgress();
    checkComplete();
  });
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    board = PRESET_GRID.map(row => [...row]);
    sel = null;
    renderBoard();
    saveProgress();
    resetCompletion(PUZZLE_ID);
    document.getElementById('message').textContent = '';
  });
}

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') { placeNumber(parseInt(e.key, 10)); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { placeNumber(0); return; }
  if (!sel) return;
  const [r, c] = sel;
  if (e.key === 'ArrowUp' && r > 0) sel = [r - 1, c];
  else if (e.key === 'ArrowDown' && r < 8) sel = [r + 1, c];
  else if (e.key === 'ArrowLeft' && c > 0) sel = [r, c - 1];
  else if (e.key === 'ArrowRight' && c < 8) sel = [r, c + 1];
  else return;
  e.preventDefault();
  renderBoard();
});

buildGrid();
buildNumpad();
loadProgress();
renderBoard();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
</body>
