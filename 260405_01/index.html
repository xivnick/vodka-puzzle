<script src="/puzzle/js/common.js?v=20"></script>
<script>
const PUZZLE_ID = '260405_01';
const ROWS = 8, COLS = 9;

// ─── 보드 초기 상태 (사용자가 수정) ───────────────────────────────────────
// '.' = 빈 칸, '#' = 막힌 칸, 알파벳 = 이미 배치된 조각
// 컬럼:  A    B    C    D    E    F    G    H    I
const INITIAL_BOARD = [
  ['I', 'Y', 'Y', 'Y', 'Y', 'N', 'N', 'N', '.' ], // 1
  ['I', '#', 'Y', '.', '.', '.', '#', 'N', 'N' ], // 2
  ['I', '.', '.', '.', '.', '#', '.', '.', '.' ], // 3
  ['I', '.', 'W', '.', '#', '.', 'T', 'T', 'T' ], // 4
  ['I', '.', 'W', 'W', '#', '.', '.', 'T', '.' ], // 5
  ['.', '.', '.', 'W', 'W', '#', '.', 'T', '.' ], // 6
  ['.', '#', '.', '.', '.', '.', '#', '.', '.' ], // 7
  ['.', '.', '.', '.', '.', '.', '.', '.', '.' ], // 8
];

const INITIAL_REMAINING = ['F','L','P','U','V','X','Z'];

// ─── 조각 색상 ───────────────────────────────────────────────────────────
const PIECE_COLORS = {
  F: '#e91e63',  // 핑크
  I: '#2196f3',  // 파랑
  L: '#4caf50',  // 초록
  N: '#ff9800',  // 주황
  P: '#9c27b0',  // 보라
  T: '#3f51b5',  // 남색
  U: '#009688',  // 청록
  V: '#f44336',  // 빨강
  W: '#607d8b',  // 청회색
  X: '#795548',  // 갈색
  Y: '#cddc39',  // 라임
  Z: '#00bcd4',  // 시안
};

// ─── 펜토미노 기본형 ─────────────────────────────────────────────────────
const BASE_SHAPES = {
  F: [[0,1],[0,2],[1,0],[1,1],[2,1]],
  I: [[0,0],[0,1],[0,2],[0,3],[0,4]],
  L: [[0,0],[1,0],[2,0],[3,0],[3,1]],
  N: [[0,1],[1,0],[1,1],[2,0],[3,0]],
  P: [[0,0],[0,1],[1,0],[1,1],[2,0]],
  T: [[0,0],[0,1],[0,2],[1,1],[2,1]],
  U: [[0,0],[0,2],[1,0],[1,1],[1,2]],
  V: [[0,0],[1,0],[2,0],[2,1],[2,2]],
  W: [[0,0],[1,0],[1,1],[2,1],[2,2]],
  X: [[0,1],[1,0],[1,1],[1,2],[2,1]],
  Y: [[0,1],[1,0],[1,1],[2,1],[3,1]],
  Z: [[0,0],[0,1],[1,1],[2,1],[2,2]],
};

// ─── 방향 생성 ───────────────────────────────────────────────────────────
function normCells(cells) {
  const minR = Math.min(...cells.map(c=>c[0]));
  const minC = Math.min(...cells.map(c=>c[1]));
  return cells.map(([r,c])=>[r-minR,c-minC]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
}
function rotate90(cells) { return normCells(cells.map(([r,c])=>[c,-r])); }
function flipH(cells) { return normCells(cells.map(([r,c])=>[r,-c])); }
function cellKey(cells) { return cells.map(([r,c])=>`${r},${c}`).join('|'); }

const ORIENTATIONS = {};
for (const [name, base] of Object.entries(BASE_SHAPES)) {
  const seen = new Set();
  const oris = [];
  let cur = normCells(base);
  for (let i = 0; i < 4; i++) {
    const k = cellKey(cur); if (!seen.has(k)) { seen.add(k); oris.push(cur); }
    const fl = flipH(cur); const fk = cellKey(fl); if (!seen.has(fk)) { seen.add(fk); oris.push(fl); }
    cur = rotate90(cur);
  }
  ORIENTATIONS[name] = oris;
}

// ─── 게임 상태 ───────────────────────────────────────────────────────────
let board, remaining, playerTurn, selectedCells, matchedPiece, gameOver;

// ─── 유틸 ────────────────────────────────────────────────────────────────
function isConnected(cells) {
  if (!cells.length) return false;
  const set = new Set(cells.map(([r,c])=>`${r},${c}`));
  const visited = new Set();
  const queue = [cells[0]];
  visited.add(`${cells[0][0]},${cells[0][1]}`);
  while (queue.length) {
    const [r,c] = queue.shift();
    for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const k = `${r+dr},${c+dc}`;
      if (set.has(k) && !visited.has(k)) { visited.add(k); queue.push([r+dr,c+dc]); }
    }
  }
  return visited.size === cells.length;
}

function matchPiece(cells) {
  if (cells.length !== 5 || !isConnected(cells)) return null;
  const norm = normCells(cells);
  const nk = cellKey(norm);
  for (const p of remaining) {
    for (const ori of ORIENTATIONS[p]) {
      if (cellKey(normCells(ori)) === nk) return p;
    }
  }
  return null;
}

function cellsOnBoard(cells, r0, c0) {
  return cells.map(([dr,dc])=>[r0+dr,c0+dc]);
}

function validPlacement(b, cells) {
  return cells.every(([r,c]) => r>=0 && r<ROWS && c>=0 && c<COLS && b[r][c]==='.');
}

function allMoves(b, rem) {
  const moves = [];
  for (const p of rem) {
    for (const ori of ORIENTATIONS[p]) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const placed = cellsOnBoard(ori, r, c);
          if (validPlacement(b, placed)) moves.push({piece:p, cells:placed});
        }
      }
    }
  }
  return moves;
}

function applyMove(b, move) {
  const nb = b.map(r=>[...r]);
  for (const [r,c] of move.cells) nb[r][c] = move.piece;
  return nb;
}

// ─── Expected win rate search ────────────────────────────────────────────
const memo = new Map();
let searchStart, searchTimedOut;

function boardKey(b) {
  return b.map(r=>r.join('')).join('|');
}
function stateKey(b, rem) {
  return boardKey(b) + '~' + [...rem].sort().join('');
}

function getWinProbability(b, rem, turn) {
  if (searchTimedOut) return 0;
  if (Date.now() - searchStart > 2500) {
    searchTimedOut = true;
    return 0;
  }
  const key = `${stateKey(b, rem)}~${turn}`;
  if (memo.has(key)) return memo.get(key);
  const moves = allMoves(b, rem);
  if (!moves.length) {
    const result = turn === 'player' ? 1 : 0;
    memo.set(key, result);
    return result;
  }
  if (turn === 'computer') {
    let best = 0;
    for (const move of moves) {
      const nb = applyMove(b, move);
      const nr = rem.filter(p=>p!==move.piece);
      best = Math.max(best, getWinProbability(nb, nr, 'player'));
      if (searchTimedOut) break;
    }
    memo.set(key, best);
    return best;
  }

  let total = 0;
  for (const move of moves) {
    const nb = applyMove(b, move);
    const nr = rem.filter(p=>p!==move.piece);
    total += getWinProbability(nb, nr, 'computer');
    if (searchTimedOut) break;
  }
  const result = total / moves.length;
  memo.set(key, result);
  return result;
}

function bestMove(b, rem) {
  searchStart = Date.now();
  searchTimedOut = false;
  memo.clear();
  const moves = allMoves(b, rem);
  if (!moves.length) return null;

  let best = null;
  let bestScore = -1;
  let tied = [];
  for (const move of moves) {
    const nb = applyMove(b, move);
    const nr = rem.filter(p=>p!==move.piece);
    const score = getWinProbability(nb, nr, 'player');
    if (searchTimedOut) break;
    if (score > bestScore) {
      bestScore = score;
      best = move;
      tied = [move];
    } else if (score === bestScore) {
      tied.push(move);
    }
  }

  if (tied.length) return tied[Math.floor(Math.random() * tied.length)];
  if (best) return best;
  return moves[Math.floor(Math.random() * moves.length)];
}

// ─── UI ──────────────────────────────────────────────────────────────────
function renderBoard() {
  const boardEl = document.getElementById('board');
  const rowLabels = document.getElementById('rowLabels');
  boardEl.innerHTML = '';
  rowLabels.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const lbl = document.createElement('div');
    lbl.className = 'row-label';
    lbl.textContent = r + 1;
    rowLabels.appendChild(lbl);
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      const v = board[r][c];
      if (v === '#') {
        cell.classList.add('blocked');
      } else if (v === '.') {
        cell.classList.add('empty');
        cell.onclick = () => handleCellClick(r, c);
      } else {
        cell.classList.add('placed');
        cell.style.background = PIECE_COLORS[v] || '#aaa';
      }
      boardEl.appendChild(cell);
    }
  }
  setCellBorders();
  updateSelection();
}

function setCellBorders() {
  const gray = '1px solid #ccc', black = '1px solid #333', none = 'none';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.getElementById(`cell-${r}-${c}`);
      if (!el) continue;
      const cur = board[r][c];
      el.style.borderTop    = r === 0        ? none : (cur === board[r-1][c] ? gray : black);
      el.style.borderLeft   = c === 0        ? none : (cur === board[r][c-1] ? gray : black);
      el.style.borderRight  = c === COLS - 1 ? none : (cur === board[r][c+1] ? gray : black);
      el.style.borderBottom = r === ROWS - 1 ? none : (cur === board[r+1][c] ? gray : black);
    }
  }
}

function updateSelection() {
  // Reset empty cells
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] !== '.') continue;
      const el = document.getElementById(`cell-${r}-${c}`);
      if (!el) continue;
      el.classList.remove('selected','invalid');
    }
  const selKeys = new Set(selectedCells.map(([r,c])=>`${r},${c}`));
  const invalid = selectedCells.length === 5 && !matchedPiece;
  for (const [r,c] of selectedCells) {
    const el = document.getElementById(`cell-${r}-${c}`);
    if (!el) continue;
    el.classList.add('selected');
    if (invalid) el.classList.add('invalid');
  }
  // Update place button
  const placeBtn = document.getElementById('placeBtn');
  placeBtn.disabled = !matchedPiece || !playerTurn || gameOver;
  // Update panel
  updatePiecePanel();
}

function updatePiecePanel() {
  const panel = document.getElementById('piecesPanel');
  panel.innerHTML = '';
  for (const p of INITIAL_REMAINING) {
    const btn = document.createElement('div');
    btn.className = 'piece-btn';
    btn.textContent = p;
    if (!remaining.includes(p)) {
      btn.classList.add('used');
    } else {
      btn.classList.add('available');
      if (p === matchedPiece) btn.classList.add('matched');
    }
    panel.appendChild(btn);
  }
}

function updateStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

// ─── 이벤트 ──────────────────────────────────────────────────────────────
function handleCellClick(r, c) {
  if (!playerTurn || gameOver || board[r][c] !== '.') return;
  const idx = selectedCells.findIndex(([sr,sc])=>sr===r&&sc===c);
  if (idx >= 0) {
    selectedCells.splice(idx, 1);
  } else {
    if (selectedCells.length >= 5) return;
    selectedCells.push([r,c]);
  }
  matchedPiece = matchPiece(selectedCells);
  if (selectedCells.length < 5) {
    updateStatus(`${selectedCells.length}칸 선택됨 — 5칸을 선택하세요`);
  } else if (matchedPiece) {
    updateStatus(`${matchedPiece} 조각 — "놓기"를 눌러 확정하세요`);
  } else {
    updateStatus('이 모양에 해당하는 조각이 없습니다');
  }
  updateSelection();
}

function handlePlace() {
  if (!matchedPiece || !playerTurn || gameOver) return;
  // Place piece
  for (const [r,c] of selectedCells) board[r][c] = matchedPiece;
  remaining = remaining.filter(p=>p!==matchedPiece);
  selectedCells = [];
  matchedPiece = null;
  playerTurn = false;
  renderBoard();
  saveProgress();
  // Check if computer can move
  if (!allMoves(board, remaining).length) {
    endGame(true);
    return;
  }
  updateStatus('컴퓨터가 생각 중...');
  document.getElementById('placeBtn').disabled = true;
  setTimeout(doComputerTurn, 700);
}

function handleClearSelection() {
  selectedCells = [];
  matchedPiece = null;
  updateStatus(playerTurn ? '당신의 차례 — 5칸을 선택하세요' : '');
  updateSelection();
}

function handleReset() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    board = INITIAL_BOARD.map(r=>[...r]);
    remaining = [...INITIAL_REMAINING];
    playerTurn = true;
    selectedCells = [];
    matchedPiece = null;
    gameOver = false;
    memo.clear();
    renderBoard();
    updateStatus('당신의 차례 — 5칸을 선택하세요');
    saveProgress();
  });
}

function doComputerTurn() {
  const move = bestMove(board, remaining);
  if (!move) { endGame(false); return; }
  // Highlight computer's move briefly
  remaining = remaining.filter(p=>p!==move.piece);
  for (const [r,c] of move.cells) board[r][c] = move.piece;
  renderBoard();
  // Flash highlight
  for (const [r,c] of move.cells) {
    const el = document.getElementById(`cell-${r}-${c}`);
    if (el) el.classList.add('computer-highlight');
  }
  setTimeout(() => {
    for (const [r,c] of move.cells) {
      const el = document.getElementById(`cell-${r}-${c}`);
      if (el) el.classList.remove('computer-highlight');
    }
  }, 800);
  playerTurn = true;
  saveProgress();
  // Check if player can move
  if (!allMoves(board, remaining).length) { endGame(false); return; }
  updateStatus('당신의 차례 — 5칸을 선택하세요');
  document.getElementById('placeBtn').disabled = true;
}

function endGame(playerWon) {
  gameOver = true;
  if (playerWon) {
    updateStatus('🎉 승리! 필승수를 찾았습니다!');
    recordCompletion(PUZZLE_ID);
  } else {
    updateStatus('패배... 필승수를 다시 찾아보세요.');
  }
}

// ─── 저장/복원 ────────────────────────────────────────────────────────────
function saveProgress() {
  saveLocalState(`puzzle_${PUZZLE_ID}`, { board, remaining, playerTurn });
}
function loadProgress() {
  const d = loadLocalState(`puzzle_${PUZZLE_ID}`);
  if (!d) return false;
  board = d.board;
  remaining = d.remaining;
  playerTurn = d.playerTurn;
  return true;
}

function handleCloudSave() {
  saveProgressCloud(PUZZLE_ID, { board, remaining, playerTurn });
}
async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, d => {
    board = d.board;
    remaining = d.remaining;
    playerTurn = d.playerTurn;
    selectedCells = [];
    matchedPiece = null;
    gameOver = false;
    renderBoard();
    updateStatus(playerTurn ? '당신의 차례 — 5칸을 선택하세요' : '컴퓨터 차례...');
  });
}

// ─── 초기화 ──────────────────────────────────────────────────────────────
function init() {
  gameOver = false;
  selectedCells = [];
  matchedPiece = null;
  if (!loadProgress()) {
    board = INITIAL_BOARD.map(r=>[...r]);
    remaining = [...INITIAL_REMAINING];
    playerTurn = true;
  }
  renderBoard();
  updateStatus(playerTurn ? '당신의 차례 — 5칸을 선택하세요' : '');
  initHeader();
  initCloudBtns();
  renderLeaderboard(PUZZLE_ID, 'leaderboard');
}
init();
</script>
</body>
</html>
