<style>
  /* ── Board ── */
  .board-wrap {
    border: 2.5px solid #222;
    position: relative;
    margin-top: 20px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: min(6.2vw, 28px);
    font-weight: 700;
    background: #fff;
    color: #222;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    border-right: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
  }

  .cell:nth-child(9n)   { border-right: none; }
  .cell:nth-child(n+73) { border-bottom: none; }

  .cell.box-right  { border-right: 2.5px solid #222; }
  .cell.box-bottom { border-bottom: 2.5px solid #222; }

  .cell.given   { color: #222; }
  .cell:not(.given) { color: #4a6fa5; }
  .cell.selected { background: #e8e8d8 !important; }
  .cell.error    { background: #f5d0d0 !important; color: #c0392b !important; }
  .cell.given.error { color: #c0392b !important; }
  .cell:hover:not(.selected):not(.error) { background: #f5f5f0; }

  /* ── Cell number span ── */
  .cell-num { line-height: 1; }

  /* ── Kropki dots (cell-relative) ── */
  .cell { position: relative; overflow: visible; }

  .kropki-dot {
    position: absolute;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    z-index: 10;
    pointer-events: none;
  }

  /* 가로 점: 셀 오른쪽 경계 중앙 */
  .kropki-dot.dot-h {
    right: -7px;
    top: 50%;
    transform: translateY(-50%);
  }

  /* 세로 점: 셀 아래쪽 경계 중앙 */
  .kropki-dot.dot-v {
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
  }

  .kropki-white { background: #fff; border: 2px solid #444; }
  .kropki-black { background: #333; }

  /* ── Numpad ── */
  .numpad {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .numpad button {
    flex: 1;
    height: 44px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    font-weight: 700;
    border: 1.5px solid #c8c3b8;
    border-radius: 3px;
    background: #f4f1eb;
    color: #333;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }

  .numpad button:hover { background: #e8e4da; }
  .numpad button:active { transform: scale(0.95); background: #ddd9cf; }

  /* ── Bottom buttons ── */
  .bottom-buttons {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .bottom-buttons button {
    flex: 1;
    height: 40px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid #d0ccc4;
    border-radius: 3px;
    background: #faf8f4;
    color: #777;
    cursor: pointer;
    transition: background 0.12s;
  }

  .bottom-buttons button:hover { background: #eeebe4; color: #555; }
  .bottom-buttons button:active { transform: scale(0.97); }

  .bottom-buttons button.danger {
    border-color: #e0bfbf;
    background: #fdf5f5;
    color: #b05050;
  }

  .bottom-buttons button.danger:hover { background: #f5e0e0; color: #8c3333; }

  @media (max-width: 540px) {
    body { padding: 0 8px 40px; }
    h1 { font-size: 1.25rem; }
    .numpad { gap: 5px; }
    .numpad button { height: min(9.5vw, 44px); font-size: min(4.4vw, 18px); }
    .bottom-buttons { gap: 5px; }
    .bottom-buttons button { height: min(8.5vw, 40px); font-size: min(3.2vw, 13px); }
    .kropki-dot { width: 11px; height: 11px; }
  }
</style>

</head>
<body class="puzzle-page pad-48">

<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>260323 약한 크롭키 스도쿠</h1>
<p class="subtitle">흰 점: 연속된 두 수 · 검은 점: 한 수가 다른 수의 2배</p>

<div class="container puzzle-width-md align-stretch">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <strong>약한 크롭키 스도쿠 규칙</strong><br>
    1. 일반 스도쿠 규칙: 같은 행, 같은 열, 같은 3×3 박스 안에 1~9가 한 번씩 들어갑니다.<br>
    2. <strong>흰 점</strong>으로 연결된 두 칸의 숫자는 1만큼 차이 납니다 (연속된 두 자연수).<br>
    3. <strong>검은 점</strong>으로 연결된 두 칸의 숫자는 한 쪽이 다른 쪽의 정확히 2배입니다.<br>
    4. 점이 없는 두 칸은 위 조건을 만족할 수도, 아닐 수도 있습니다 (약한 크롭키).
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="numpad" id="numpad"></div>

  <div class="bottom-buttons">
    <button onclick="placeNumber(0)">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>

  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>

  <div class="message" id="message"></div>

  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const PUZZLE_ID = '260323_02';
const SAVE_KEY  = 'puzzle_260323_02';

// 주어진 셀 [row, col, value] (0-indexed)
const PRESETS = [
  [0,5,6],[0,7,3],
  [1,4,8],
  [2,2,1],[2,6,7],[2,8,5],
  [4,1,9],[4,4,2],[4,6,8],
  [5,2,7],[5,3,1],[5,6,3],
  [6,0,4],[6,1,3],[6,5,1],[6,7,5],
  [7,0,7],[7,3,5],[7,7,1],
  [8,4,7],[8,6,2],
];

// 크롭키 점 [row, col, dir('h'=가로/'v'=세로), type('w'=흰/'b'=검)]
// 'h': (r,c)와 (r,c+1) 사이  |  'v': (r,c)와 (r+1,c) 사이
const DOTS = [
  [0,1,'v','w'],   // ○ (0,1)-(1,1)
  [0,7,'v','w'],   // ○ (0,7)=3 오른쪽 → (0,8) ∈ {2,4}
  [1,1,'h','b'],   // ● (0,7)=3 아래 → (1,7)=6
  [1,6,'h','b'],   // ● (1,2)-(2,2)
  [2,4,'v','w'],   // ○ (3,3)-(4,3)
  [3,2,'h','w'],   // ○ (3,5)-(4,5)
  [3,5,'h','w'],   // ○ (3,5)-(4,5)
  [4,0,'v','b'],   // ● (5,0)-(6,0)=4 → (5,0) ∈ {2,8}
  [4,8,'v','b'],   // ● (5,8)-(6,8)
  [6,1,'h','w'],   // ● (6,1)=3 오른쪽 → (6,2)=6
  [6,6,'h','w'],   // ○ (6,2)-(6,3)
  [7,4,'v','w'],   // ○ (6,6)-(6,7)=5 → (6,6) ∈ {4,6}
];

// ── 보드 초기화 ──────────────────────────────────────────────────────────────
let board = Array.from({length: 9}, () => Array(9).fill(0));
const GIVEN = new Set(PRESETS.map(([r,c]) => `${r},${c}`));

PRESETS.forEach(([r,c,v]) => board[r][c] = v);

let sel = null; // [r, c]

// ── 그리드 빌드 ───────────────────────────────────────────────────────────────
function buildGrid() {
  const boardEl = document.getElementById('board');
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' +
        (GIVEN.has(`${r},${c}`) ? ' given' : '') +
        (c === 2 || c === 5 ? ' box-right' : '') +
        (r === 2 || r === 5 ? ' box-bottom' : '');
      cell.dataset.r = r;
      cell.dataset.c = c;
      const numSpan = document.createElement('span');
      numSpan.className = 'cell-num';
      cell.appendChild(numSpan);
      cell.addEventListener('click', () => { sel = [r, c]; renderBoard(); });
      boardEl.appendChild(cell);
    }
  }

  // 크롭키 점: 해당 셀 내부에 부착 (셀 경계 중앙)
  for (const [r, c, dir, type] of DOTS) {
    const cell = boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if (!cell) continue;
    const dot = document.createElement('div');
    dot.className = `kropki-dot dot-${dir} kropki-${type === 'w' ? 'white' : 'black'}`;
    cell.appendChild(dot);
  }
}

// ── 충돌 감지 ─────────────────────────────────────────────────────────────────
function getConflicts() {
  const set = new Set();

  // 행/열/박스 중복
  for (let r = 0; r < 9; r++) {
    const seen = new Map();
    for (let c = 0; c < 9; c++) {
      const v = board[r][c]; if (!v) continue;
      if (seen.has(v)) { set.add(`${r},${c}`); set.add(`${r},${seen.get(v)}`); }
      else seen.set(v, c);
    }
  }
  for (let c = 0; c < 9; c++) {
    const seen = new Map();
    for (let r = 0; r < 9; r++) {
      const v = board[r][c]; if (!v) continue;
      if (seen.has(v)) { set.add(`${r},${c}`); set.add(`${seen.get(v)},${c}`); }
      else seen.set(v, r);
    }
  }
  for (let br = 0; br < 3; br++) {
    for (let bc = 0; bc < 3; bc++) {
      const seen = new Map();
      for (let dr = 0; dr < 3; dr++) {
        for (let dc = 0; dc < 3; dc++) {
          const r = br*3+dr, c = bc*3+dc;
          const v = board[r][c]; if (!v) continue;
          if (seen.has(v)) { set.add(`${r},${c}`); set.add(seen.get(v)); }
          else seen.set(v, `${r},${c}`);
        }
      }
    }
  }

  // 크롭키 점 위반
  for (const [r, c, dir, type] of DOTS) {
    const r2 = dir === 'v' ? r + 1 : r;
    const c2 = dir === 'h' ? c + 1 : c;
    const a = board[r][c], b = board[r2][c2];
    if (!a || !b) continue;
    const valid = type === 'w'
      ? Math.abs(a - b) === 1
      : Math.max(a, b) === 2 * Math.min(a, b);
    if (!valid) { set.add(`${r},${c}`); set.add(`${r2},${c2}`); }
  }

  return set;
}

// ── 렌더 ──────────────────────────────────────────────────────────────────────
function renderBoard() {
  const conflicts = getConflicts();
  document.querySelectorAll('.cell').forEach(cell => {
    const r = +cell.dataset.r, c = +cell.dataset.c;
    const isConflict = conflicts.has(`${r},${c}`);
    const isSelected = sel && sel[0] === r && sel[1] === c;
    cell.classList.toggle('selected', isSelected);
    cell.classList.toggle('error', isConflict);
    cell.querySelector('.cell-num').textContent = board[r][c] || '';
  });
}

// ── 숫자 입력 ────────────────────────────────────────────────────────────────
function placeNumber(v) {
  if (!sel) return;
  const [r, c] = sel;
  if (GIVEN.has(`${r},${c}`)) return;
  board[r][c] = v;
  renderBoard();
  saveProgress();
  checkComplete();
}

function buildNumpad() {
  const np = document.getElementById('numpad');
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.addEventListener('click', () => placeNumber(i));
    np.appendChild(btn);
  }
}

// ── 완성 체크 ────────────────────────────────────────────────────────────────
function checkComplete() {
  const msg = document.getElementById('message');
  const allFilled = board.every(row => row.every(v => v > 0));
  if (!allFilled || getConflicts().size > 0) { msg.textContent = ''; return; }
  msg.textContent = '축하합니다! 퍼즐을 완성했습니다!';
  recordCompletion(PUZZLE_ID);
}

// ── 저장/복원 ────────────────────────────────────────────────────────────────
function saveProgress() {
  saveLocalState(SAVE_KEY, board);
}

function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (!saved) return;
  if (Array.isArray(saved) && saved.length === 9) {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (!GIVEN.has(`${r},${c}`)) board[r][c] = saved[r][c] || 0;
      }
    }
  }
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++)
        if (!GIVEN.has(`${r},${c}`)) board[r][c] = 0;
    sel = null;
    document.getElementById('message').textContent = '';
    renderBoard();
    saveProgress();
  });
}

// ── 클라우드 ─────────────────────────────────────────────────────────────────
async function handleCloudSave() { await saveProgressCloud(PUZZLE_ID, board); }
async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== 9) return;
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++)
        if (!GIVEN.has(`${r},${c}`)) board[r][c] = state[r][c] || 0;
    renderBoard();
    saveProgress();
    checkComplete();
  });
}

// ── 키보드 ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') { placeNumber(parseInt(e.key)); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { placeNumber(0); return; }
  if (!sel) return;
  const [r, c] = sel;
  if (e.key === 'ArrowUp'    && r > 0) sel = [r-1, c];
  else if (e.key === 'ArrowDown'  && r < 8) sel = [r+1, c];
  else if (e.key === 'ArrowLeft'  && c > 0) sel = [r, c-1];
  else if (e.key === 'ArrowRight' && c < 8) sel = [r, c+1];
  else return;
  e.preventDefault();
  renderBoard();
});

// ── 초기화 ───────────────────────────────────────────────────────────────────
buildGrid();
buildNumpad();
loadProgress();
renderBoard();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
</body>
</html>
