<style>
  .board-shell {
    --board-shell-width: min(80vw, 420px);
    --left-clue-pad: 32px;
    --top-clue-pad: 36px;
    width: var(--board-shell-width);
    margin-top: 20px;
  }

  .clue-frame {
    position: relative;
    width: 100%;
    padding-top: var(--top-clue-pad);
    padding-left: var(--left-clue-pad);
    box-sizing: border-box;
  }

  .board-wrap {
    position: relative;
    border: 2.5px solid #222;
    background: #fff;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #888;
    border-bottom: 1px solid #888;
    background: #fff;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }

  .cell:nth-child(8n) { border-right: none; }
  .cell:nth-child(n+57) { border-bottom: none; }
  .cell.selected { background: #e8e8d8; }
  .cell.error { background: #f5d0d0; }
  .cell.fixed { cursor: default; }
  .cell.given { background: #ece9e2; }
  .cell:hover:not(.fixed):not(.selected):not(.error) { background: #f7f7f2; }

  .row-clue,
  .col-clue {
    position: absolute;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: min(4.8vw, 18px);
    font-weight: 700;
    color: #222;
    line-height: 1;
  }

  .row-clue {
    left: 0;
    width: 24px;
    text-align: center;
    transform: translateY(-50%);
  }

  .col-clue {
    top: 0;
    transform: translateX(-50%);
  }

  .clue-ok { color: #5f8b52; }
  .clue-over { color: #c0392b; }

  .token {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .part-body {
    position: absolute;
    background: #111;
  }

  .h-left .part-body {
    left: 12%;
    top: 20%;
    width: 76%;
    height: 60%;
    border-radius: 999px 6px 6px 999px;
  }

  .h-mid .part-body,
  .v-mid .part-body,
  .mid .part-body {
    left: 18%;
    top: 18%;
    width: 64%;
    height: 64%;
    border-radius: 4px;
  }

  .h-right .part-body {
    left: 12%;
    top: 20%;
    width: 76%;
    height: 60%;
    border-radius: 6px 999px 999px 6px;
  }

  .v-top .part-body {
    left: 20%;
    top: 12%;
    width: 60%;
    height: 76%;
    border-radius: 999px 999px 6px 6px;
  }

  .v-bottom .part-body {
    left: 20%;
    top: 12%;
    width: 60%;
    height: 76%;
    border-radius: 6px 6px 999px 999px;
  }

  .single .part-body {
    left: 18%;
    top: 18%;
    width: 64%;
    height: 64%;
    border-radius: 50%;
  }

  .sea-fixed .part-body {
    display: none;
  }

  .water-mark::before,
  .water-mark::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 54%;
    height: 2px;
    background: #8a8a8a;
    border-radius: 999px;
    transform-origin: center;
  }

  .water-mark::before { transform: translate(-50%, -50%) rotate(45deg); }
  .water-mark::after { transform: translate(-50%, -50%) rotate(-45deg); }
  .sea-fixed .water-mark::before,
  .sea-fixed .water-mark::after {
    background: #8a8a8a;
  }

  .toolbar-bottom {
    display: grid;
    gap: 6px;
    width: calc(var(--board-shell-width) - var(--left-clue-pad));
  }

  .toolbar-bottom {
    grid-template-columns: repeat(2, 1fr);
    margin-top: 12px;
  }
  .toolbar-bottom button {
    position: relative;
    height: 42px;
    border: 1.5px solid #c8c3b8;
    border-radius: 3px;
    background: #f4f1eb;
    cursor: pointer;
  }

  .toolbar-bottom button:hover { background: #e8e4da; }

  .toolbar-bottom button {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #666;
  }

  .toolbar-bottom button.danger {
    border-color: #e0bfbf;
    background: #fdf5f5;
    color: #b05050;
  }

  .fleet {
    width: calc(var(--board-shell-width) - var(--left-clue-pad));
    margin-top: 10px;
  }

  .fleet-title {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 8px;
  }

  .fleet-row {
    display: flex;
    gap: 14px;
    margin-bottom: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .fleet-ship {
    position: relative;
    height: 22px;
    display: inline-flex;
    align-items: center;
  }

  .fleet-ship.used { opacity: 0.28; }

  .fleet-ship .seg,
  .fleet-ship .cap-l,
  .fleet-ship .cap-r,
  .fleet-ship .single-dot {
    height: 22px;
    background: #111;
  }

  .fleet-ship .cap-l,
  .fleet-ship .cap-r,
  .fleet-ship .seg {
    width: 20px;
  }

  .fleet-ship .cap-l { border-radius: 999px 4px 4px 999px; }
  .fleet-ship .seg { border-radius: 0; margin: 0 2px; }
  .fleet-ship .cap-l { margin-right: 2px; }
  .fleet-ship .cap-r { border-radius: 4px 999px 999px 4px; }
  .fleet-ship .cap-r { margin-left: 2px; }
  .fleet-ship .single-dot {
    width: 22px;
    border-radius: 50%;
  }

  @media (max-width: 540px) {
    body { padding: 0 8px 40px; }
    .board-shell,
    .toolbar-bottom,
    .fleet { width: min(92vw, 432px); }
    .board-shell {
      --board-shell-width: min(88vw, 392px);
      --left-clue-pad: 28px;
      --top-clue-pad: 32px;
    }
    .clue-frame {
      padding-top: var(--top-clue-pad);
      padding-left: var(--left-clue-pad);
    }
    .toolbar-bottom button { height: min(10vw, 42px); }
    .fleet-row { gap: 10px; }
    .fleet-ship { height: 18px; }
    .fleet-ship .seg,
    .fleet-ship .cap-l,
    .fleet-ship .cap-r { width: 16px; height: 18px; }
    .fleet-ship .seg { border-radius: 0; }
    .fleet-ship .single-dot { width: 18px; height: 18px; }
  }
</style>

<div class="container puzzle-width-md align-stretch">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <strong>Battleship 규칙</strong><br>
    1. 배는 90° 단위로 회전하여 배치할 수 있습니다.<br>
    2. 배의 각 칸은 정확히 격자의 한 칸을 차지합니다.<br>
    3. 서로 다른 배끼리는 변으로도, 대각선으로도 인접할 수 없습니다.<br>
    4. 배가 없는 칸은 바다로 간주합니다.<br>
    5. 이미 주어진 배 조각이나 바다 칸도 있습니다.<br>
    6. 바깥 숫자는 해당 행 또는 열에 배가 차지하는 총 칸 수를 뜻합니다.
  </div>

  <div class="board-shell">
    <div class="clue-frame" id="clueFrame">
      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>
    </div>

  <div class="toolbar-bottom">
    <button onclick="clearSelected()">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>

  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>

  <div class="fleet">
    <div class="fleet-title">남은 배</div>
    <div id="fleet"></div>
  </div>

  <div class="message" id="message"></div>

  <div class="lb-section">

    <div id="leaderboard"></div>

<script>
const PUZZLE_ID = '260428_01';
const SAVE_KEY = 'puzzle_260428_01';
const SIZE = 8;

const TOKENS = {
  EMPTY: '',
  H_LEFT: 'h-left',
  H_MID: 'h-mid',
  H_RIGHT: 'h-right',
  V_TOP: 'v-top',
  V_MID: 'v-mid',
  V_BOTTOM: 'v-bottom',
  MID: 'mid',
  SINGLE: 'single',
  WATER: 'water',
  SEA: 'sea'
};

const ROW_CLUES = [null, null, null, null, 1, null, 3, 2];
const COL_CLUES = [null, null, 4, null, 4, null, 3, null];
const FLEET = { 4: 1, 3: 2, 2: 3, 1: 4 };

const GIVENS = {
  '0,7': TOKENS.SEA,
  '1,1': TOKENS.H_LEFT,
  '3,3': TOKENS.H_MID,
  '5,5': TOKENS.SINGLE,
  '7,0': TOKENS.SEA
};

let board = Array.from({ length: SIZE }, (_, r) =>
  Array.from({ length: SIZE }, (_, c) => GIVENS[`${r},${c}`] || TOKENS.EMPTY)
);
let selected = null;
let pressTimer = null;
let pressTargetKey = null;
let longPressTriggered = false;

const OCCUPIED_TOKENS = new Set([
  TOKENS.H_LEFT, TOKENS.H_MID, TOKENS.H_RIGHT,
  TOKENS.V_TOP, TOKENS.V_MID, TOKENS.V_BOTTOM,
  TOKENS.MID,
  TOKENS.SINGLE
]);

function buildBoard() {
  const boardEl = document.getElementById('board');
  const wrapEl = boardEl.parentElement;

  for (let c = 0; c < SIZE; c += 1) {
    if (COL_CLUES[c] == null) continue;
    const el = document.createElement('div');
    el.className = 'col-clue';
    el.dataset.col = c;
    el.style.left = `${((c + 0.5) / SIZE) * 100}%`;
    el.style.top = '-24px';
    el.textContent = COL_CLUES[c];
    wrapEl.appendChild(el);
  }

  for (let r = 0; r < SIZE; r += 1) {
    if (ROW_CLUES[r] == null) continue;
    const el = document.createElement('div');
    el.className = 'row-clue';
    el.dataset.row = r;
    el.style.top = `${((r + 0.5) / SIZE) * 100}%`;
    el.style.left = '-28px';
    el.textContent = ROW_CLUES[r];
    wrapEl.appendChild(el);
  }

  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const cell = document.createElement('div');
      cell.className = 'cell'
        + (GIVENS[`${r},${c}`] ? ' fixed given' : '');
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (!GIVENS[`${r},${c}`]) {
        const key = `${r},${c}`;
        cell.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          clearPressState();
          selected = [r, c];
          pressTargetKey = key;
          pressTimer = setTimeout(() => {
            if (pressTargetKey !== key) return;
            longPressTriggered = true;
            toggleWaterAt(r, c);
          }, 420);
        });
        cell.addEventListener('pointerup', event => {
          if (event.button !== 0) return;
          const sameTarget = pressTargetKey === key;
          const didLongPress = longPressTriggered;
          clearPressState();
          if (sameTarget && !didLongPress) toggleShipAt(r, c);
        });
        cell.addEventListener('pointerleave', clearPressState);
        cell.addEventListener('pointercancel', clearPressState);
        cell.addEventListener('contextmenu', event => {
          event.preventDefault();
          clearPressState();
          selected = [r, c];
          toggleWaterAt(r, c);
        });
      } else {
        cell.addEventListener('click', () => {
          selected = [r, c];
          render();
        });
      }
      boardEl.appendChild(cell);
    }
  }
}

function createTokenEl(token) {
  const wrapper = document.createElement('div');
  wrapper.className = 'token ' + token;
  if (token === TOKENS.WATER) {
    const x = document.createElement('div');
    x.className = 'water-mark';
    wrapper.appendChild(x);
    return wrapper;
  }
  if (token === TOKENS.SEA) {
    wrapper.classList.add('sea-fixed');
    const x = document.createElement('div');
    x.className = 'water-mark';
    wrapper.appendChild(x);
    return wrapper;
  }
  if (OCCUPIED_TOKENS.has(token)) {
    const body = document.createElement('div');
    body.className = 'part-body';
    wrapper.appendChild(body);
  }
  return wrapper;
}

function clearPressState() {
  if (pressTimer) clearTimeout(pressTimer);
  pressTimer = null;
  pressTargetKey = null;
  longPressTriggered = false;
}

function placeToken(token) {
  if (!selected) return;
  const [r, c] = selected;
  if (GIVENS[`${r},${c}`]) return;
  board[r][c] = token;
  normalizeShips();
  saveProgress();
  render();
  checkComplete();
}

function clearSelected() {
  if (!selected) return;
  const [r, c] = selected;
  if (GIVENS[`${r},${c}`]) return;
  board[r][c] = TOKENS.EMPTY;
  normalizeShips();
  saveProgress();
  render();
}

function toggleShipAt(r, c) {
  board[r][c] = isOccupied(board[r][c]) ? TOKENS.EMPTY : TOKENS.MID;
  normalizeShips();
  saveProgress();
  render();
  checkComplete();
}

function toggleWaterAt(r, c) {
  board[r][c] = board[r][c] === TOKENS.WATER ? TOKENS.EMPTY : TOKENS.WATER;
  normalizeShips();
  saveProgress();
  render();
  checkComplete();
}

function normalizeShips() {
  const next = board.map(row => [...row]);
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      if (GIVENS[`${r},${c}`] || !isOccupied(board[r][c])) continue;
      const neighbors = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
        .filter(([nr, nc]) => nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && isOccupied(board[nr][nc]));
      if (neighbors.length === 0) {
        next[r][c] = TOKENS.SINGLE;
      } else if (neighbors.length === 1) {
        const [nr, nc] = neighbors[0];
        if (nr < r) next[r][c] = TOKENS.V_BOTTOM;
        else if (nr > r) next[r][c] = TOKENS.V_TOP;
        else if (nc < c) next[r][c] = TOKENS.H_RIGHT;
        else next[r][c] = TOKENS.H_LEFT;
      } else {
        next[r][c] = TOKENS.MID;
      }
    }
  }
  board = next;
}

function isOccupied(token) {
  return OCCUPIED_TOKENS.has(token);
}

function getOrthNeighbors(r, c) {
  return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
    .filter(([nr, nc]) => nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && isOccupied(board[nr][nc]));
}

function analyzeShips() {
  const visited = new Set();
  const ships = [];
  const tokenErrors = new Set();
  const adjacencyErrors = new Set();
  const componentByCell = new Map();

  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const key = `${r},${c}`;
      if (visited.has(key) || !isOccupied(board[r][c])) continue;
      const stack = [[r, c]];
      const cells = [];
      visited.add(key);
      while (stack.length) {
        const [cr, cc] = stack.pop();
        cells.push([cr, cc]);
        getOrthNeighbors(cr, cc).forEach(([nr, nc]) => {
          const nk = `${nr},${nc}`;
          if (!visited.has(nk)) {
            visited.add(nk);
            stack.push([nr, nc]);
          }
        });
      }
      const index = ships.length;
      cells.forEach(([cr, cc]) => componentByCell.set(`${cr},${cc}`, index));
      ships.push({ cells });
    }
  }

  ships.forEach(ship => {
    const rows = [...new Set(ship.cells.map(([r]) => r))];
    const cols = [...new Set(ship.cells.map(([, c]) => c))];
    ship.length = ship.cells.length;
    ship.orientation = ship.length === 1 ? 'single'
      : rows.length === 1 ? 'h'
      : cols.length === 1 ? 'v'
      : 'invalid';
    ship.invalid = ship.length < 1 || ship.length > 4 || ship.orientation === 'invalid';
    ship.complete = false;
    if (!ship.invalid && ship.length > 1) {
      if (ship.orientation === 'h') {
        const sorted = [...ship.cells].sort((a, b) => a[1] - b[1]);
        for (let i = 1; i < sorted.length; i += 1) {
          if (sorted[i][1] !== sorted[i - 1][1] + 1) ship.invalid = true;
        }
        if (!ship.invalid) {
          const [fr, fc] = sorted[0];
          const [lr, lc] = sorted[sorted.length - 1];
          const endsOk = board[fr][fc] === TOKENS.H_LEFT && board[lr][lc] === TOKENS.H_RIGHT;
          const midsOk = sorted.slice(1, -1).every(([r, c]) => [TOKENS.H_MID, TOKENS.MID].includes(board[r][c]));
          ship.complete = endsOk && midsOk;
        }
      } else if (ship.orientation === 'v') {
        const sorted = [...ship.cells].sort((a, b) => a[0] - b[0]);
        for (let i = 1; i < sorted.length; i += 1) {
          if (sorted[i][0] !== sorted[i - 1][0] + 1) ship.invalid = true;
        }
        if (!ship.invalid) {
          const [fr, fc] = sorted[0];
          const [lr, lc] = sorted[sorted.length - 1];
          const endsOk = board[fr][fc] === TOKENS.V_TOP && board[lr][lc] === TOKENS.V_BOTTOM;
          const midsOk = sorted.slice(1, -1).every(([r, c]) => [TOKENS.V_MID, TOKENS.MID].includes(board[r][c]));
          ship.complete = endsOk && midsOk;
        }
      }
    } else if (!ship.invalid && ship.length === 1) {
      ship.complete = board[ship.cells[0][0]][ship.cells[0][1]] === TOKENS.SINGLE;
    }
    if (ship.invalid) ship.cells.forEach(([r, c]) => tokenErrors.add(`${r},${c}`));
  });

  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      if (!isOccupied(board[r][c])) continue;
      for (let dr = -1; dr <= 1; dr += 1) {
        for (let dc = -1; dc <= 1; dc += 1) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
          if (!isOccupied(board[nr][nc])) continue;
          const a = componentByCell.get(`${r},${c}`);
          const b = componentByCell.get(`${nr},${nc}`);
          if (a !== b) {
            adjacencyErrors.add(`${r},${c}`);
            adjacencyErrors.add(`${nr},${nc}`);
          }
        }
      }
    }
  }

  const validComplete = ships.filter(ship => ship.complete);
  const usedCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
  validComplete.forEach(ship => {
    if (usedCounts[ship.length] != null && usedCounts[ship.length] < FLEET[ship.length]) {
      usedCounts[ship.length] += 1;
    }
  });

  return { ships, tokenErrors, adjacencyErrors, usedCounts };
}

function updateFleet(usedCounts) {
  const fleet = document.getElementById('fleet');
  fleet.innerHTML = '';
  [[4, 1], [3, 2], [2, 3], [1, 4]].forEach(([len, count], rowIndex) => {
    if (rowIndex === 0 || rowIndex === 2) {
      const row = document.createElement('div');
      row.className = 'fleet-row';
      fleet.appendChild(row);
    }
    const row = fleet.lastElementChild;
    for (let i = 0; i < count; i += 1) {
      const ship = document.createElement('div');
      ship.className = 'fleet-ship' + (i < usedCounts[len] ? ' used' : '');
      ship.classList.add(`len-${len}`);
      if (len === 1) {
        const dot = document.createElement('span');
        dot.className = 'single-dot';
        ship.appendChild(dot);
      } else {
        const capL = document.createElement('span');
        capL.className = 'cap-l';
        ship.appendChild(capL);
        for (let j = 0; j < len - 2; j += 1) {
          const seg = document.createElement('span');
          seg.className = 'seg';
          ship.appendChild(seg);
        }
        const capR = document.createElement('span');
        capR.className = 'cap-r';
        ship.appendChild(capR);
      }
      row.appendChild(ship);
    }
  });
}

function renderClues() {
  const rowCounts = board.map(row => row.filter(isOccupied).length);
  const colCounts = Array.from({ length: SIZE }, (_, c) => board.map(row => row[c]).filter(isOccupied).length);
  document.querySelectorAll('.row-clue').forEach(el => {
    const r = Number(el.dataset.row);
    el.className = 'row-clue';
    if (rowCounts[r] === ROW_CLUES[r]) el.classList.add('clue-ok');
    else if (rowCounts[r] > ROW_CLUES[r]) el.classList.add('clue-over');
  });
  document.querySelectorAll('.col-clue').forEach(el => {
    const c = Number(el.dataset.col);
    el.className = 'col-clue';
    if (colCounts[c] === COL_CLUES[c]) el.classList.add('clue-ok');
    else if (colCounts[c] > COL_CLUES[c]) el.classList.add('clue-over');
  });
}

function render() {
  const analysis = analyzeShips();
  document.querySelectorAll('.cell').forEach(cell => {
    const r = Number(cell.dataset.r);
    const c = Number(cell.dataset.c);
    const key = `${r},${c}`;
    const token = board[r][c];
    cell.className = 'cell'
      + (GIVENS[key] ? ' fixed given' : '')
      + (selected && selected[0] === r && selected[1] === c ? ' selected' : '')
      + ((analysis.tokenErrors.has(key) || analysis.adjacencyErrors.has(key)) ? ' error' : '');
    cell.innerHTML = '';
    if (token) cell.appendChild(createTokenEl(token));
  });
  renderClues();
  updateFleet(analysis.usedCounts);
}

function isComplete() {
  const analysis = analyzeShips();
  if (analysis.tokenErrors.size || analysis.adjacencyErrors.size) return false;
  for (let r = 0; r < SIZE; r += 1) {
    if (ROW_CLUES[r] != null) {
      const count = board[r].filter(isOccupied).length;
      if (count !== ROW_CLUES[r]) return false;
    }
  }
  for (let c = 0; c < SIZE; c += 1) {
    if (COL_CLUES[c] != null) {
      const count = board.map(row => row[c]).filter(isOccupied).length;
      if (count !== COL_CLUES[c]) return false;
    }
  }
  return [1,2,3,4].every(len => analysis.usedCounts[len] === FLEET[len]);
}

function checkComplete() {
  const msg = document.getElementById('message');
  if (!isComplete()) {
    msg.textContent = '';
    return;
  }
  msg.textContent = '축하합니다! 퍼즐을 완성했습니다!';
  recordCompletion(PUZZLE_ID);
}

function saveProgress() {
  saveLocalState(SAVE_KEY, board);
}

function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (!Array.isArray(saved) || saved.length !== SIZE) return;
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      if (GIVENS[`${r},${c}`]) {
        board[r][c] = GIVENS[`${r},${c}`];
      } else {
        board[r][c] = typeof saved[r][c] === 'string' ? saved[r][c] : TOKENS.EMPTY;
      }
    }
  }
  normalizeShips();
}

async function handleCloudSave() {
  await saveProgressCloud(PUZZLE_ID, board);
}

async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== SIZE) return;
    for (let r = 0; r < SIZE; r += 1) {
      for (let c = 0; c < SIZE; c += 1) {
        if (GIVENS[`${r},${c}`]) board[r][c] = GIVENS[`${r},${c}`];
        else board[r][c] = typeof state[r][c] === 'string' ? state[r][c] : TOKENS.EMPTY;
      }
    }
    render();
    saveProgress();
    checkComplete();
  });
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    board = Array.from({ length: SIZE }, (_, r) =>
      Array.from({ length: SIZE }, (_, c) => GIVENS[`${r},${c}`] || TOKENS.EMPTY)
    );
    selected = null;
    render();
    saveProgress();
    resetCompletion(PUZZLE_ID);
    document.getElementById('message').textContent = '';
  });
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey || e.altKey) || !selected) return;
  const key = e.key.toLowerCase();
  if (e.key === 'Backspace' || e.key === 'Delete') {
    clearSelected();
    return;
  }
  const [r, c] = selected;
  if (e.key === 'ArrowUp' && r > 0) selected = [r - 1, c];
  else if (e.key === 'ArrowDown' && r < SIZE - 1) selected = [r + 1, c];
  else if (e.key === 'ArrowLeft' && c > 0) selected = [r, c - 1];
  else if (e.key === 'ArrowRight' && c < SIZE - 1) selected = [r, c + 1];
  else return;
  e.preventDefault();
  render();
});

buildBoard();
loadProgress();
render();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
</body>
</html>
