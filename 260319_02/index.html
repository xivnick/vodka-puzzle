<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;

}
.sky-clue {

.sky-corner {}
.sky-cell {
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 1.1rem;
  font-weight: 700;
  color: #4a6fa5;
  cursor: pointer;
  transition: background 0.1s;
  background: #fff;
  box-sizing: border-box;
}
.sky-cell:hover { background: #f0efe8; }
.sky-cell.selected { background: #e8e8d8; }
.sky-cell.conflict { background: #f5d0d0; color: #c0392b; }
.numpad {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  margin-bottom: 8px;
  width: calc(6 * min(46px, 11vw));

<body>
<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>260319 스카이스크레이퍼 #2</h1>
<p class="subtitle">6×6 · 각 방향에서 보이는 건물 수를 힌트로 숫자를 채우세요</p>
<div class="container">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <p>• 6×6 격자의 각 가로/세로줄에 1~6의 숫자를 하나씩 채워넣으세요.</p>
    <p>• 격자 바깥의 숫자는, 그 방향에서 바라봤을 때 보이는 건물의 수입니다.</p>
    <p>• 숫자가 클수록 건물이 높습니다. 높은 건물은 낮은 건물을 가립니다.</p>
  </div>
  <div class="sky-board" id="skyBoard"></div>
  <div class="numpad" id="numpad"></div>
  <div class="bottom-buttons">
    <button onclick="input(0)">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>
  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>
  <div class="message" id="message"></div>
  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>
<script>
const PUZZLE_ID = '260319_02';
const SAVE_KEY = 'puzzle_260319_02';
const N = 6;
const CLUES = {
  top:    [null, 2, 3, null, 2, 3],
  right:  [null, null, 2, 3, null, null],
  bottom: [2, 3, null, 2, 3, null],
  left:   [2, 3, null, null, 2, 3]
};

let board = Array.from({length: N}, () => Array(N).fill(0));
let sel = null;

function countVisible(arr) {
  let cnt = 0, max = 0;
  for (const v of arr) { if (v > max) { cnt++; max = v; } }
  return cnt;
}
function countVisiblePrefix(arr) {
  let cnt = 0, max = 0;
  for (const v of arr) {
    if (!v) break;
    if (v > max) { cnt++; max = v; }
  }
  return cnt;
}

function getConflicts() {
  const set = new Set();
  for (let r = 0; r < N; r++) {
    const seen = new Map();
    for (let c = 0; c < N; c++) {
      const v = board[r][c]; if (!v) continue;
      if (seen.has(v)) { set.add(`${r},${c}`); set.add(`${r},${seen.get(v)}`); }
      else seen.set(v, c);
    }
  }
  for (let c = 0; c < N; c++) {
    const seen = new Map();
    for (let r = 0; r < N; r++) {
      const v = board[r][c]; if (!v) continue;
      if (seen.has(v)) { set.add(`${r},${c}`); set.add(`${seen.get(v)},${c}`); }
      else seen.set(v, r);
    }
  }
  return set;
}

function getClueErrors() {
  const errs = new Set();
  for (let c = 0; c < N; c++) {
    const col = board.map(row => row[c]);
    const complete = col.every(v => v);
    if (CLUES.top[c] !== null) {
      const pre = countVisiblePrefix(col);
      if (pre > CLUES.top[c] || (complete && countVisible(col) !== CLUES.top[c])) errs.add(`T${c}`);
    }
    if (CLUES.bottom[c] !== null) {
      const rev = [...col].reverse();
      const pre = countVisiblePrefix(rev);
      if (pre > CLUES.bottom[c] || (complete && countVisible(rev) !== CLUES.bottom[c])) errs.add(`B${c}`);
    }
  }
  for (let r = 0; r < N; r++) {
    const row = board[r];
    const complete = row.every(v => v);
    if (CLUES.left[r] !== null) {
      const pre = countVisiblePrefix(row);
      if (pre > CLUES.left[r] || (complete && countVisible(row) !== CLUES.left[r])) errs.add(`L${r}`);
    }
    if (CLUES.right[r] !== null) {
      const rev = [...row].reverse();
      const pre = countVisiblePrefix(rev);
      if (pre > CLUES.right[r] || (complete && countVisible(rev) !== CLUES.right[r])) errs.add(`R${r}`);
    }
  }
  return errs;
}

function isComplete() {
  if (!board.every(row => row.every(v => v > 0))) return false;
  if (getConflicts().size > 0) return false;
  for (let c = 0; c < N; c++) {
    const col = board.map(row => row[c]);
    if (CLUES.top[c] !== null && countVisible(col) !== CLUES.top[c]) return false;
    if (CLUES.bottom[c] !== null && countVisible([...col].reverse()) !== CLUES.bottom[c]) return false;
  }
  for (let r = 0; r < N; r++) {
    const row = board[r];
    if (CLUES.left[r] !== null && countVisible(row) !== CLUES.left[r]) return false;
    if (CLUES.right[r] !== null && countVisible([...row].reverse()) !== CLUES.right[r]) return false;
  }
  return true;
}

function buildGrid() {
  const g = document.getElementById('skyBoard');
  g.appendChild(Object.assign(document.createElement('div'), {className: 'sky-corner'}));
  for (let c = 0; c < N; c++) {
    const d = document.createElement('div');
    d.className = 'sky-clue';
    d.dataset.ckey = `T${c}`;
    if (CLUES.top[c] !== null) d.textContent = CLUES.top[c];
    g.appendChild(d);
  }
  g.appendChild(Object.assign(document.createElement('div'), {className: 'sky-corner'}));

  for (let r = 0; r < N; r++) {
    const lc = document.createElement('div');
    lc.className = 'sky-clue';
    lc.dataset.ckey = `L${r}`;
    if (CLUES.left[r] !== null) lc.textContent = CLUES.left[r];
    g.appendChild(lc);

    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'sky-cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.style.borderTop    = r === 0     ? '2px solid #222' : '1px solid #aaa';
      cell.style.borderLeft   = c === 0     ? '2px solid #222' : '1px solid #aaa';
      cell.style.borderBottom = r === N - 1 ? '2px solid #222' : '1px solid #aaa';
      cell.style.borderRight  = c === N - 1 ? '2px solid #222' : '1px solid #aaa';
      cell.addEventListener('click', () => { sel = [r, c]; renderBoard(); });
      g.appendChild(cell);
    }

    const rc = document.createElement('div');
    rc.className = 'sky-clue';
    rc.dataset.ckey = `R${r}`;
    if (CLUES.right[r] !== null) rc.textContent = CLUES.right[r];
    g.appendChild(rc);
  }

  g.appendChild(Object.assign(document.createElement('div'), {className: 'sky-corner'}));
  for (let c = 0; c < N; c++) {
    const d = document.createElement('div');
    d.className = 'sky-clue';
    d.dataset.ckey = `B${c}`;
    if (CLUES.bottom[c] !== null) d.textContent = CLUES.bottom[c];
    g.appendChild(d);
  }
  g.appendChild(Object.assign(document.createElement('div'), {className: 'sky-corner'}));
}

function renderBoard() {
  const conflicts = getConflicts();
  const clueErrs = getClueErrors();
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.querySelector(`.sky-cell[data-r="${r}"][data-c="${c}"]`);
      if (!cell) continue;
      const isConflict = conflicts.has(`${r},${c}`);
      const isSelected = sel && sel[0] === r && sel[1] === c;
      cell.className = 'sky-cell' + (isSelected ? ' selected' : '') + (isConflict ? ' conflict' : '');
      cell.textContent = board[r][c] || '';
    }
  }
  document.querySelectorAll('.sky-clue').forEach(el => {
    el.classList.toggle('clue-err', clueErrs.has(el.dataset.ckey));
  });
}

function buildNumpad() {
  const np = document.getElementById('numpad');
  for (let i = 1; i <= N; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.addEventListener('click', () => input(i));
    np.appendChild(btn);
  }
}

function input(v) {
  if (!sel) return;
  const [r, c] = sel;
  board[r][c] = v;
  renderBoard();
  saveProgress();
  checkComplete();
}

function checkComplete() {
  const msg = document.getElementById('message');
  if (!isComplete()) { msg.textContent = ''; return; }
  msg.textContent = '축하합니다! 퍼즐을 완성했습니다!';
  recordCompletion(PUZZLE_ID);
}

function saveProgress() { localStorage.setItem(SAVE_KEY, JSON.stringify(board)); }
function loadProgress() {
  const s = localStorage.getItem(SAVE_KEY);
  if (!s) return;
  try {
    const saved = JSON.parse(s);
    if (Array.isArray(saved) && saved.length === N) board = saved;
  } catch(e) {}
}

async function handleCloudSave() { await saveProgressCloud(PUZZLE_ID, board); }
async function handleCloudLoad() {
  const state = await loadProgressCloud(PUZZLE_ID);
  if (!state || !Array.isArray(state) || state.length !== N) return;
  board = state;
  renderBoard();
  saveProgress();
  checkComplete();
}

function resetBoard() {
  if (!confirm('정말 초기화하시겠습니까?')) return;
  board = Array.from({length: N}, () => Array(N).fill(0));
  sel = null;
  document.getElementById('message').textContent = '';
  renderBoard();
  saveProgress();
  resetCompletion(PUZZLE_ID);
}

function toggleRules() { document.getElementById('rulesBox').classList.toggle('open'); }

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= String(N)) { input(parseInt(e.key)); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { input(0); return; }
  if (!sel) return;
  const [r, c] = sel;
  if (e.key === 'ArrowUp' && r > 0) sel = [r-1, c];
  else if (e.key === 'ArrowDown' && r < N-1) sel = [r+1, c];
  else if (e.key === 'ArrowLeft' && c > 0) sel = [r, c-1];
  else if (e.key === 'ArrowRight' && c < N-1) sel = [r, c+1];
  else return;
  e.preventDefault();
  renderBoard();
});

buildGrid();
buildNumpad();
loadProgress();
renderBoard();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
