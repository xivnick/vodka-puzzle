<h1>260330 스카이스크레이퍼 스도쿠</h1>
<p class="subtitle">스도쿠 + 스카이스크레이퍼 규칙을 동시에 만족하도록 채우세요</p>
<div class="container puzzle-width-md align-center">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <strong>스카이스크레이퍼 스도쿠 규칙</strong><br>
    • 9×9 격자의 각 가로줄, 세로줄, 3×3 박스에 1~9를 하나씩 채우세요.<br>
    • 격자 바깥의 숫자는 그 방향에서 바라봤을 때 보이는 건물의 수입니다.<br>
    • 숫자가 클수록 건물이 높으며, 높은 건물은 낮은 건물을 가립니다.
  </div>
  <div class="sky-board" id="skyBoard"></div>
  <div class="numpad" id="numpad"></div>
  <div class="bottom-buttons">
    <button onclick="input(0)">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>
  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>
  <div class="message" id="message"></div>
  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>
<script src="/puzzle/js/common.js?v=21"></script>
<script>
const PUZZLE_ID = '260330_02';
const SAVE_KEY  = 'puzzle_260330_02';
const N = 9;
const CLUES = {
  top:    [null, null, 5, null, null, 7, null, null, null],
  bottom: [null, null, null, 4, null, null, 2, null, null],
  left:   [null, null, null, 7, null, null, 3, null, null],
  right:  [null, null, 8, null, null, 5, null, null, null]
};
const PRESETS = {
  '1,1': 1, '1,4': 2, '1,7': 3,
  '4,1': 4, '4,4': 5, '4,7': 6,
  '7,1': 7, '7,4': 8, '7,7': 9
};

let board = Array.from({length: N}, () => Array(N).fill(0));
let sel = null;

function applyPresets() {
  for (const [key, val] of Object.entries(PRESETS)) {
    const [r, c] = key.split(',').map(Number);
    board[r][c] = val;
  }
}
applyPresets();

function countVisible(arr) {
  let cnt = 0, max = 0;
  for (const v of arr) { if (v > max) { cnt++; max = v; } }
  return cnt;
}
function countVisiblePrefix(arr) {
  let cnt = 0, max = 0;
  for (const v of arr) {
    if (!v) break;
    if (v > max) { cnt++; max = v; }
  }
  return cnt;
}

function getConflicts() {
  const set = new Set();
  for (let r = 0; r < N; r++) {
    const seen = new Map();
    for (let c = 0; c < N; c++) {
      const v = board[r][c]; if (!v) continue;
      if (seen.has(v)) { set.add(`${r},${c}`); set.add(`${r},${seen.get(v)}`); }
      else seen.set(v, c);
    }
  }
  for (let c = 0; c < N; c++) {
    const seen = new Map();
    for (let r = 0; r < N; r++) {
      const v = board[r][c]; if (!v) continue;
      if (seen.has(v)) { set.add(`${r},${c}`); set.add(`${seen.get(v)},${c}`); }
      else seen.set(v, r);
    }
  }
  for (let br = 0; br < 3; br++) {
    for (let bc = 0; bc < 3; bc++) {
      const seen = new Map();
      for (let dr = 0; dr < 3; dr++) {
        for (let dc = 0; dc < 3; dc++) {
          const r = br*3+dr, c = bc*3+dc;
          const v = board[r][c]; if (!v) continue;
          if (seen.has(v)) {
            const [pr, pc] = seen.get(v);
            set.add(`${r},${c}`); set.add(`${pr},${pc}`);
          } else seen.set(v, [r, c]);
        }
      }
    }
  }
  return set;
}

function getClueErrors() {
  const errs = new Set();
  for (let c = 0; c < N; c++) {
    const col = board.map(row => row[c]);
    const complete = col.every(v => v);
    if (CLUES.top[c] !== null) {
      if (countVisiblePrefix(col) > CLUES.top[c] || (complete && countVisible(col) !== CLUES.top[c])) errs.add(`T${c}`);
    }
    if (CLUES.bottom[c] !== null) {
      const rev = [...col].reverse();
      if (countVisiblePrefix(rev) > CLUES.bottom[c] || (complete && countVisible(rev) !== CLUES.bottom[c])) errs.add(`B${c}`);
    }
  }
  for (let r = 0; r < N; r++) {
    const row = board[r];
    const complete = row.every(v => v);
    if (CLUES.left[r] !== null) {
      if (countVisiblePrefix(row) > CLUES.left[r] || (complete && countVisible(row) !== CLUES.left[r])) errs.add(`L${r}`);
    }
    if (CLUES.right[r] !== null) {
      const rev = [...row].reverse();
      if (countVisiblePrefix(rev) > CLUES.right[r] || (complete && countVisible(rev) !== CLUES.right[r])) errs.add(`R${r}`);
    }
  }
  return errs;
}

function isComplete() {
  if (!board.every(row => row.every(v => v > 0))) return false;
  if (getConflicts().size > 0) return false;
  for (let c = 0; c < N; c++) {
    const col = board.map(row => row[c]);
    if (CLUES.top[c]    !== null && countVisible(col)                  !== CLUES.top[c])    return false;
    if (CLUES.bottom[c] !== null && countVisible([...col].reverse())   !== CLUES.bottom[c]) return false;
  }
  for (let r = 0; r < N; r++) {
    const row = board[r];
    if (CLUES.left[r]   !== null && countVisible(row)                  !== CLUES.left[r])   return false;
    if (CLUES.right[r]  !== null && countVisible([...row].reverse())   !== CLUES.right[r])  return false;
  }
  return true;
}

function buildGrid() {
  const g = document.getElementById('skyBoard');

  g.appendChild(document.createElement('div'));
  for (let c = 0; c < N; c++) {
    const d = document.createElement('div');
    d.className = 'sky-clue'; d.dataset.ckey = `T${c}`;
    if (CLUES.top[c] !== null) d.textContent = CLUES.top[c];
    g.appendChild(d);
  }
  g.appendChild(document.createElement('div'));

  for (let r = 0; r < N; r++) {
    const lc = document.createElement('div');
    lc.className = 'sky-clue'; lc.dataset.ckey = `L${r}`;
    if (CLUES.left[r] !== null) lc.textContent = CLUES.left[r];
    g.appendChild(lc);

    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      const isPreset = PRESETS[`${r},${c}`] !== undefined;
      cell.className = 'sky-cell' + (isPreset ? ' preset' : '');
      cell.dataset.r = r; cell.dataset.c = c;
      const bt = (r % 3 === 0) ? '2.5px solid #222' : '1px solid #bbb';
      const bl = (c % 3 === 0) ? '2.5px solid #222' : '1px solid #bbb';
      const bb = (r === N-1)   ? '2.5px solid #222' : '1px solid #bbb';
      const br = (c === N-1)   ? '2.5px solid #222' : '1px solid #bbb';
      cell.style.cssText = `border-top:${bt};border-left:${bl};border-bottom:${bb};border-right:${br};`;
      cell.addEventListener('click', () => { sel = [r, c]; renderBoard(); });
      g.appendChild(cell);
    }

    const rc = document.createElement('div');
    rc.className = 'sky-clue'; rc.dataset.ckey = `R${r}`;
    if (CLUES.right[r] !== null) rc.textContent = CLUES.right[r];
    g.appendChild(rc);
  }

  g.appendChild(document.createElement('div'));
  for (let c = 0; c < N; c++) {
    const d = document.createElement('div');
    d.className = 'sky-clue'; d.dataset.ckey = `B${c}`;
    if (CLUES.bottom[c] !== null) d.textContent = CLUES.bottom[c];
    g.appendChild(d);
  }
  g.appendChild(document.createElement('div'));
}

function renderBoard() {
  const conflicts = getConflicts();
  const clueErrs  = getClueErrors();
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.querySelector(`.sky-cell[data-r="${r}"][data-c="${c}"]`);
      if (!cell) continue;
      const isPreset   = PRESETS[`${r},${c}`] !== undefined;
      const isConflict = conflicts.has(`${r},${c}`);
      const isSelected = sel && sel[0] === r && sel[1] === c;
      cell.className = 'sky-cell'
        + (isPreset   ? ' preset'   : '')
        + (isSelected ? ' selected' : '')
        + (isConflict ? ' conflict' : '');
      cell.textContent = board[r][c] || '';
    }
  }
  document.querySelectorAll('.sky-clue').forEach(el => {
    el.classList.toggle('clue-err', clueErrs.has(el.dataset.ckey));
  });
}

function buildNumpad() {
  const np = document.getElementById('numpad');
  for (let i = 1; i <= N; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.addEventListener('click', () => input(i));
    np.appendChild(btn);
  }
}

function input(v) {
  if (!sel) return;
  const [r, c] = sel;
  if (PRESETS[`${r},${c}`] !== undefined) return;
  board[r][c] = v;
  renderBoard();
  saveProgress();
  checkComplete();
}

function checkComplete() {
  const msg = document.getElementById('message');
  if (!isComplete()) { msg.textContent = ''; return; }
  msg.textContent = '축하합니다! 퍼즐을 완성했습니다! 🎉';
  recordCompletion(PUZZLE_ID);
}

function saveProgress() { saveLocalState(SAVE_KEY, board); }
function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (Array.isArray(saved) && saved.length === N) {
    board = saved;
    applyPresets();
  }
}

async function handleCloudSave() { await saveProgressCloud(PUZZLE_ID, board); }
async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== N) return;
    board = state;
    applyPresets();
    renderBoard();
    saveProgress();
    checkComplete();
  });
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    board = Array.from({length: N}, () => Array(N).fill(0));
    applyPresets();
    sel = null;
    document.getElementById('message').textContent = '';
    renderBoard();
    saveProgress();
  });
}

document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') { input(parseInt(e.key)); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { input(0); return; }
  if (!sel) return;
  const [r, c] = sel;
  if      (e.key === 'ArrowUp'    && r > 0)   sel = [r-1, c];
  else if (e.key === 'ArrowDown'  && r < N-1) sel = [r+1, c];
  else if (e.key === 'ArrowLeft'  && c > 0)   sel = [r, c-1];
  else if (e.key === 'ArrowRight' && c < N-1) sel = [r, c+1];
  else return;
  e.preventDefault();
  renderBoard();
});

buildGrid();
buildNumpad();
loadProgress();
renderBoard();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
