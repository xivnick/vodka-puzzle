<style>
  .back {
    align-self: flex-start;
    font-size: 0.82rem;
    font-weight: 400;
    color: #999;
    text-decoration: none;
    margin-bottom: 16px;
    transition: color 0.12s;
  }

  .back:hover { color: #555; }

  /* ── Board ── */
  .board-wrap {
    border: 2.5px solid #222;
    position: relative;
    margin-top: 20px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
    z-index: 2;
  }

  .thermo-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: min(6.2vw, 28px);
    font-weight: 700;
    background: transparent;
    color: #222;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    border-right: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
    position: relative;
    z-index: 2;
  }

  .cell:nth-child(9n) { border-right: none; }
  .cell:nth-child(n+73) { border-bottom: none; }

  .cell.box-right { border-right: 2.5px solid #222; }
  .cell.box-bottom { border-bottom: 2.5px solid #222; }

  .cell.given { color: #222; }
  .cell:not(.given) { color: #4a6fa5; }
  .cell.selected { background: rgba(232, 232, 216, 0.85) !important; }
  .cell.error { background: rgba(245, 208, 208, 0.85) !important; color: #c0392b !important; }
  .cell.given.error { color: #c0392b !important; }
  .cell:hover:not(.selected):not(.error) { background: rgba(245, 245, 240, 0.7); }

  /* ── Numpad ── */
  .numpad {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .numpad button {
    flex: 1;
    height: 44px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    font-weight: 700;
    border: 1.5px solid #c8c3b8;
    border-radius: 3px;
    background: #f4f1eb;
    color: #333;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }

  .numpad button:hover { background: #e8e4da; }
  .numpad button:active { transform: scale(0.95); background: #ddd9cf; }

  /* ── Responsive ── */
  @media (max-width: 540px) {
    body { padding: 0 8px 40px; }
    h1 { font-size: 1.25rem; }

    .numpad { gap: 5px; }
    .numpad button {
      height: min(9.5vw, 44px);
      font-size: min(4.4vw, 18px);
    }

    .bottom-buttons { gap: 5px; }
    .bottom-buttons button {
      height: min(8.5vw, 40px);
      font-size: min(3.2vw, 13px);
    }
  }

  @media (max-width: 380px) {
    .numpad button { height: 36px; font-size: 16px; }
    .bottom-buttons button { height: 34px; font-size: 11px; }
  }

</style>
<link rel="stylesheet" href="/puzzle/css/common.css?v=19">
<script src="/puzzle/js/common.js?v=19"></script>
</head>
<body class="puzzle-page pad-48">

<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>260316 온도계 스도쿠</h1>
<p class="subtitle">온도계의 큰 원에서 끝으로 갈수록 숫자가 커져야 합니다</p>

<div class="container puzzle-width-md align-stretch">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <strong>온도계 스도쿠 규칙</strong><br>
    1. 일반 스도쿠 규칙: 같은 행, 같은 열, 같은 3×3 박스 안에 1~9가 한 번씩 들어갑니다.<br>
    2. 온도계의 큰 원(bulb) 부분부터 반대쪽 끝까지 들어가는 숫자는 오름차순이어야 합니다. 큰 원에 가장 작은 숫자, 끝으로 갈수록 커져야 합니다.
  </div>

  <div class="board-wrap">
    <svg class="thermo-overlay" id="thermoSvg" viewBox="0 0 9 9"></svg>
    <div class="board" id="board"></div>
  </div>

  <div class="numpad" id="numpad"></div>

  <div class="bottom-buttons">
    <button onclick="placeNumber(0)">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>
  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>

  <div class="message" id="message"></div>

  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const PUZZLE_ID = '260316_02';
const initial = [
  [0,4,0, 0,0,2, 1,0,0],
  [0,0,0, 7,1,0, 8,0,0],
  [0,0,0, 0,5,0, 0,0,4],

  [6,0,2, 0,0,1, 0,0,0],
  [0,8,0, 0,0,0, 4,0,0],
  [5,0,0, 3,0,0, 0,0,7],

  [0,0,0, 0,0,0, 6,0,8],
  [0,3,0, 0,0,0, 0,9,0],
  [7,0,0, 0,6,0, 0,0,0],
];

// Thermometers: each array is [row, col] from bulb to tip (values must increase)
const thermometers = [
  [[1,0],[2,0],[3,0],[4,0]],   // R2C1 → R5C1
  [[0,1],[1,1],[2,1],[3,1]],   // R1C2 → R4C2
  [[2,2],[3,2],[4,2],[5,2]],   // R3C3 → R6C3
  [[4,3],[5,3],[6,3],[7,3]],   // R5C4 → R8C4
  [[3,4],[4,4],[5,4],[6,4]],   // R4C5 → R7C5
  [[4,5],[5,5],[6,5],[7,5]],   // R5C6 → R8C6
  [[2,6],[3,6],[4,6],[5,6]],   // R3C7 → R6C7
  [[0,7],[1,7],[2,7],[3,7]],   // R1C8 → R4C8
  [[1,8],[2,8],[3,8],[4,8]],   // R2C9 → R5C9
];

const SAVE_KEY = 'puzzle_260316_02';

function saveProgress() {
  saveLocalState(SAVE_KEY, board);
}

function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (Array.isArray(saved) && saved.length === 9 && Array.isArray(saved[0]) && saved[0].length === 9) {
    return saved;
  }
  return initial.map(r => [...r]);
}

let board = loadProgress();
let givenSet = new Set();
let selected = null;

function drawThermometers(errorIndices) {
  const svg = document.getElementById('thermoSvg');
  svg.innerHTML = '';

  const lineWidth = 0.24;
  const bulbRadius = 0.3;
  const normalColor = 'rgba(175, 192, 215, 0.4)';
  const errorColor = 'rgba(200, 80, 80, 0.4)';

  thermometers.forEach((thermo, idx) => {
    const color = errorIndices && errorIndices.has(idx) ? errorColor : normalColor;

    if (thermo.length > 1) {
      const points = thermo.map(([r, c]) => `${c + 0.5},${r + 0.5}`).join(' ');
      const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      polyline.setAttribute('points', points);
      polyline.setAttribute('stroke', color);
      polyline.setAttribute('stroke-width', lineWidth);
      polyline.setAttribute('stroke-linecap', 'round');
      polyline.setAttribute('stroke-linejoin', 'round');
      polyline.setAttribute('fill', 'none');
      svg.appendChild(polyline);
    }

    const [br, bc] = thermo[0];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', bc + 0.5);
    circle.setAttribute('cy', br + 0.5);
    circle.setAttribute('r', bulbRadius);
    circle.setAttribute('fill', color);
    svg.appendChild(circle);
  });
}

function init() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;

      if (c === 2 || c === 5) cell.classList.add('box-right');
      if (r === 2 || r === 5) cell.classList.add('box-bottom');

      if (initial[r][c] !== 0) {
        cell.textContent = initial[r][c];
        cell.classList.add('given');
        givenSet.add(r * 9 + c);
      } else if (board[r][c] !== 0) {
        cell.textContent = board[r][c];
      }

      cell.addEventListener('click', () => selectCell(r, c));
      boardEl.appendChild(cell);
    }
  }

  const numpad = document.getElementById('numpad');
  numpad.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.textContent = n;
    btn.addEventListener('click', () => placeNumber(n));
    numpad.appendChild(btn);
  }

  drawThermometers();
  validate();
}

function selectCell(r, c) {
  document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
  selected = { r, c };
  getCell(r, c).classList.add('selected');
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function placeNumber(n) {
  if (!selected) return;
  const { r, c } = selected;
  if (givenSet.has(r * 9 + c)) return;

  board[r][c] = n;
  const cell = getCell(r, c);
  cell.textContent = n || '';
  saveProgress();
  validate();
  checkComplete();
}

function validate() {
  const errors = new Set();

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const v = board[r][c];
      if (v === 0) continue;

      // Row
      for (let cc = 0; cc < 9; cc++) {
        if (cc !== c && board[r][cc] === v) {
          errors.add(r * 9 + c);
          errors.add(r * 9 + cc);
        }
      }

      // Column
      for (let rr = 0; rr < 9; rr++) {
        if (rr !== r && board[rr][c] === v) {
          errors.add(r * 9 + c);
          errors.add(rr * 9 + c);
        }
      }

      // Box
      const br = Math.floor(r / 3) * 3;
      const bc = Math.floor(c / 3) * 3;
      for (let rr = br; rr < br + 3; rr++) {
        for (let cc = bc; cc < bc + 3; cc++) {
          if ((rr !== r || cc !== c) && board[rr][cc] === v) {
            errors.add(r * 9 + c);
            errors.add(rr * 9 + cc);
          }
        }
      }
    }
  }

  // Thermometer check: values must strictly increase from bulb to tip
  const errorThermos = new Set();
  thermometers.forEach((thermo, ti) => {
    for (let i = 0; i < thermo.length; i++) {
      const [r1, c1] = thermo[i];
      if (board[r1][c1] === 0) continue;
      for (let j = i + 1; j < thermo.length; j++) {
        const [r2, c2] = thermo[j];
        if (board[r2][c2] === 0) continue;
        if (board[r1][c1] >= board[r2][c2]) {
          errors.add(r1 * 9 + c1);
          errors.add(r2 * 9 + c2);
          errorThermos.add(ti);
        }
      }
    }
  });

  document.querySelectorAll('.cell').forEach(el => {
    const idx = parseInt(el.dataset.r) * 9 + parseInt(el.dataset.c);
    el.classList.toggle('error', errors.has(idx));
  });

  drawThermometers(errorThermos);

  return errors.size === 0;
}

function checkComplete() {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++)
      if (board[r][c] === 0) return;

  if (validate()) {
    document.getElementById('message').textContent = '축하합니다! 퍼즐을 완성했습니다!';
    recordCompletion(PUZZLE_ID);
  }
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    board = initial.map(r => [...r]);
    selected = null;
    document.getElementById('message').textContent = '';
    document.querySelectorAll('.cell').forEach(el => {
      const r = parseInt(el.dataset.r), c = parseInt(el.dataset.c);
      el.classList.remove('selected', 'error');
      el.textContent = initial[r][c] || '';
    });
    saveProgress();
    validate();
  });
}


document.addEventListener('keydown', e => {
  if (!selected) return;
  const { r, c } = selected;
  if (e.key >= '1' && e.key <= '9') {
    placeNumber(parseInt(e.key));
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    placeNumber(0);
  } else if (e.key === 'ArrowUp' && r > 0) selectCell(r - 1, c);
  else if (e.key === 'ArrowDown' && r < 8) selectCell(r + 1, c);
  else if (e.key === 'ArrowLeft' && c > 0) selectCell(r, c - 1);
  else if (e.key === 'ArrowRight' && c < 8) selectCell(r, c + 1);
});

async function handleCloudSave() {
  await saveProgressCloud(PUZZLE_ID, board);
}
async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== 9) return;
    board = state;
    renderBoard();
    saveProgress();
    checkComplete();
  });
}

init();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
</body>
</html>
