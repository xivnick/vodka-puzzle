function show(){ $('preview').srcdoc=pages[view]; }
function paint(){const d=$('preview').contentDocument;if(!d?.getElementById('streakValue'))return;

 const board=d.getElementById('sudokuBoard');board.innerHTML=Array.from({length:81},(_,i)=>{const r=Math.floor(i/9),c=i%9,n=(r*3+Math.floor(r/3)+c)%9+1,given=i%4===0||i%7===0;return `<button type="button" class="sudoku-cell${given?' given':''}" aria-label="${r+1}행 ${c+1}열">${given||state.done?n:''}</button>`}).join('');
 const message=d.getElementById('sudokuComplete');message.hidden=!state.done;message.textContent=`퍼즐을 완성했습니다! ${state.n}일 ${state.protected?'스트릭':'연속'} 달성!`;

}
