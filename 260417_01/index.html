<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>260417 체스 기물 스도쿠</title>
<meta property="og:title" content="260417 체스 기물 스도쿠">
<meta property="og:description" content="같은 체스 기물이 서로 공격하지 않게 6x6 스도쿠를 완성하세요">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .container {
    width: min(94vw, 560px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .board-wrap {
    border: 2px solid #222;
    position: relative;
    margin-top: 16px;
    background: #f9f9f9;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(10vw, 46px);
    font-weight: 700;
    color: #222;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s, color 0.12s;
    border-right: 1px solid rgba(34, 34, 34, 0.5);
    border-bottom: 1px solid rgba(34, 34, 34, 0.5);
    background: #f5f5f5;
  }

  .cell.dark {
    background: #dcdcdc;
  }

  .cell:nth-child(6n) { border-right: none; }
  .cell:nth-child(n+31) { border-bottom: none; }
  .cell.box-right { border-right: 2px solid #222; }
  .cell.box-bottom { border-bottom: 2px solid #222; }
  .cell.selected { background: rgba(232, 232, 216, 0.95) !important; }
  .cell.error {
    background: #f5d0d0 !important;
    color: #c0392b !important;
  }
  .cell.given { color: #222; }
  .cell:hover:not(.selected) { background: rgba(245, 245, 240, 0.85); }

  .cell-fixed {
    position: absolute;
    inset: 10%;
    border: 2px solid rgba(34, 34, 34, 0.32);
    background: transparent;
    z-index: 1;
    pointer-events: none;
  }

  .cell.dark .cell-fixed {
    border-color: rgba(255, 255, 255, 0.62);
  }

  .piece-glyph {
    position: relative;
    z-index: 2;
    width: min(9.2vw, 42px);
    height: min(9.2vw, 42px);
    display: block;
    object-fit: contain;
  }

  .piece-pad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 12px;
  }

  .asset-note {
    margin-top: 8px;
    font-size: 0.72rem;
    line-height: 1.5;
    color: #888;
    text-align: center;
  }

  .piece-pad button {
    height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #c8c3b8;
    border-radius: 3px;
    background: #f4f1eb;
    color: #333;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }

  .piece-pad button:hover { background: #e8e4da; }
  .piece-pad button:active { transform: scale(0.96); background: #ddd9cf; }

  .piece-label {
    display: block;
    margin-top: 3px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 10px;
    font-weight: 500;
    line-height: 1;
  }

  .piece-pad-icon {
    width: 24px;
    height: 24px;
    display: block;
    object-fit: contain;
  }

  .message {
    font-size: 0.88rem;
    line-height: 1.5;
    min-height: 1.6em;
    margin-top: 8px;
    margin-bottom: 6px;
    color: #777;
    text-align: center;
  }

  @media (max-width: 540px) {
    .piece-pad { gap: 5px; }
    .piece-pad button {
      height: min(12vw, 48px);
      font-size: min(7vw, 28px);
    }
    .piece-label {
      font-size: min(2.5vw, 10px);
    }
    .bottom-buttons button {
      height: min(9vw, 40px);
      font-size: min(3.4vw, 13px);
    }
  }
</style>
<link rel="stylesheet" href="/puzzle/css/common.css?v=23">
<script src="/puzzle/js/common.js?v=26"></script>
</head>
<body class="puzzle-page pad-48">

<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>체스 기물 스도쿠</h1>
<p class="subtitle">같은 체스 기물이 서로 공격하지 않게 6x6 스도쿠를 완성하세요</p>

<div class="container">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    가로, 세로, 그리고 각 칸 안에는 각 기물이 1개씩 들어갑니다.<br>
    또한 같은 기물은 서로를 공격할 수 없습니다.<br>
    (다른 기물들은 뛰어넘는다고 가정합니다.)<br>
    킹, 퀸, 룩, 나이트, 비숍, 폰 각 6개씩을 판에 배치하세요.
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="asset-note">
    Wikimedia Commons의 Cburnett 체스 세트(BSD License)를 사용했습니다.
  </div>

  <div class="piece-pad" id="piecePad"></div>

  <div class="bottom-buttons">
    <button onclick="placePiece('')">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>

  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>

  <div class="message" id="message"></div>

  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const PUZZLE_ID = '260417_01';
const SAVE_KEY = 'puzzle_260417_01';
const SIZE = 6;

const PIECES = [
  { id: 'K', src: '/puzzle/img/chess/Chess_klt45.svg', label: '킹' },
  { id: 'Q', src: '/puzzle/img/chess/Chess_qlt45.svg', label: '퀸' },
  { id: 'R', src: '/puzzle/img/chess/Chess_rlt45.svg', label: '룩' },
  { id: 'N', src: '/puzzle/img/chess/Chess_nlt45.svg', label: '나이트' },
  { id: 'B', src: '/puzzle/img/chess/Chess_blt45.svg', label: '비숍' },
  { id: 'P', src: '/puzzle/img/chess/Chess_plt45.svg', label: '폰' }
];
const PIECE_MAP = Object.fromEntries(PIECES.map(piece => [piece.id, piece]));
const BOX_H = 3;
const BOX_W = 2;

const PRESET_GRID = [
  ['', '', '', '', '', ''],
  ['', '', '', '', 'P', ''],
  ['N', '', '', '', '', ''],
  ['', '', '', '', 'B', ''],
  ['', '', '', '', '', ''],
  ['', '', '', '', '', '']
];

let board = PRESET_GRID.map(row => [...row]);
const GIVEN = new Set();
PRESET_GRID.forEach((row, r) => row.forEach((v, c) => { if (v) GIVEN.add(`${r},${c}`); }));
let sel = null;

function pieceImg(id, className = 'piece-glyph') {
  const piece = PIECE_MAP[id];
  if (!piece) return '';
  return `<img class="${className}" src="${piece.src}" alt="${piece.label}">`;
}

function buildGrid() {
  const boardEl = document.getElementById('board');
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const cell = document.createElement('div');
      cell.className = 'cell'
        + (((r + c) % 2 === 1) ? ' dark' : '')
        + (GIVEN.has(`${r},${c}`) ? ' given' : '')
        + (c === 1 || c === 3 ? ' box-right' : '')
        + (r === 2 ? ' box-bottom' : '');
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', () => {
        sel = [r, c];
        renderBoard();
      });
      if (GIVEN.has(`${r},${c}`)) {
        const fixed = document.createElement('span');
        fixed.className = 'cell-fixed';
        cell.appendChild(fixed);
      }
      const pieceLayer = document.createElement('span');
      pieceLayer.className = 'cell-piece';
      cell.appendChild(pieceLayer);
      boardEl.appendChild(cell);
    }
  }
}

function buildPiecePad() {
  const pad = document.getElementById('piecePad');
  PIECES.forEach(piece => {
    const btn = document.createElement('button');
    btn.innerHTML = `${pieceImg(piece.id, 'piece-pad-icon')}<span class="piece-label">${piece.label}</span>`;
    btn.addEventListener('click', () => placePiece(piece.id));
    pad.appendChild(btn);
  });
}

function boxIndex(r, c) {
  return `${Math.floor(r / BOX_H)},${Math.floor(c / BOX_W)}`;
}

function getSudokuConflicts() {
  const errors = new Set();

  for (let r = 0; r < SIZE; r += 1) {
    const seen = new Map();
    for (let c = 0; c < SIZE; c += 1) {
      const v = board[r][c];
      if (!v) continue;
      if (seen.has(v)) {
        errors.add(`${r},${c}`);
        errors.add(`${r},${seen.get(v)}`);
      } else {
        seen.set(v, c);
      }
    }
  }

  for (let c = 0; c < SIZE; c += 1) {
    const seen = new Map();
    for (let r = 0; r < SIZE; r += 1) {
      const v = board[r][c];
      if (!v) continue;
      if (seen.has(v)) {
        errors.add(`${r},${c}`);
        errors.add(`${seen.get(v)},${c}`);
      } else {
        seen.set(v, r);
      }
    }
  }

  const seenBoxes = new Map();
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const v = board[r][c];
      if (!v) continue;
      const key = `${boxIndex(r, c)}|${v}`;
      if (!seenBoxes.has(key)) {
        seenBoxes.set(key, []);
      }
      seenBoxes.get(key).push(`${r},${c}`);
    }
  }
  seenBoxes.forEach(list => {
    if (list.length >= 2) list.forEach(key => errors.add(key));
  });

  return errors;
}

function attacks(piece, r1, c1, r2, c2) {
  const dr = r2 - r1;
  const dc = c2 - c1;
  const adr = Math.abs(dr);
  const adc = Math.abs(dc);
  if (piece === 'K') return Math.max(adr, adc) === 1;
  if (piece === 'Q') return dr === 0 || dc === 0 || adr === adc;
  if (piece === 'R') return dr === 0 || dc === 0;
  if (piece === 'B') return adr === adc;
  if (piece === 'N') return (adr === 1 && adc === 2) || (adr === 2 && adc === 1);
  if (piece === 'P') return dr === -1 && adc === 1;
  return false;
}

function getAttackConflicts() {
  const errors = new Set();
  const positions = new Map();

  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const v = board[r][c];
      if (!v) continue;
      if (!positions.has(v)) positions.set(v, []);
      positions.get(v).push([r, c]);
    }
  }

  positions.forEach((cells, piece) => {
    for (let i = 0; i < cells.length; i += 1) {
      for (let j = i + 1; j < cells.length; j += 1) {
        const [r1, c1] = cells[i];
        const [r2, c2] = cells[j];
        if (attacks(piece, r1, c1, r2, c2) || attacks(piece, r2, c2, r1, c1)) {
          errors.add(`${r1},${c1}`);
          errors.add(`${r2},${c2}`);
        }
      }
    }
  });

  return errors;
}

function getErrorSet() {
  const errors = getSudokuConflicts();
  getAttackConflicts().forEach(key => errors.add(key));
  return errors;
}

function renderBoard() {
  const errors = getErrorSet();
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      const v = board[r][c];
      cell.classList.toggle('selected', !!sel && sel[0] === r && sel[1] === c);
      cell.classList.toggle('error', errors.has(`${r},${c}`));
      const pieceLayer = cell.querySelector('.cell-piece');
      if (pieceLayer) pieceLayer.innerHTML = v ? pieceImg(v) : '';
    }
  }
  const complete = isComplete();
  document.getElementById('message').textContent = complete ? '축하합니다! 퍼즐을 완성했습니다!' : '';
  if (complete) recordCompletion(PUZZLE_ID);
}

function placePiece(piece) {
  if (!sel) return;
  const [r, c] = sel;
  if (GIVEN.has(`${r},${c}`)) return;
  board[r][c] = piece;
  renderBoard();
  saveProgress();
}

function isComplete() {
  if (board.some(row => row.some(v => !v))) return false;
  if (getErrorSet().size > 0) return false;
  return true;
}

function saveProgress() {
  saveLocalState(SAVE_KEY, board);
}

function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (!Array.isArray(saved) || saved.length !== SIZE) return;
  board = saved.map((row, r) => row.map((value, c) => GIVEN.has(`${r},${c}`) ? PRESET_GRID[r][c] : (PIECE_MAP[value] ? value : '')));
}

async function handleCloudSave() {
  await saveProgressCloud(PUZZLE_ID, board);
}

async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== SIZE) return;
    board = state.map((row, r) => row.map((value, c) => GIVEN.has(`${r},${c}`) ? PRESET_GRID[r][c] : (PIECE_MAP[value] ? value : '')));
    renderBoard();
    saveProgress();
  });
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    board = PRESET_GRID.map(row => [...row]);
    sel = null;
    renderBoard();
    saveProgress();
    resetCompletion(PUZZLE_ID);
  });
}

document.addEventListener('keydown', e => {
  if (!sel) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key;
  const pieceKeyMap = {
    k: 'K', K: 'K', ㅏ: 'K',
    q: 'Q', Q: 'Q', ㅂ: 'Q',
    r: 'R', R: 'R', ㄱ: 'R',
    n: 'N', N: 'N', ㅜ: 'N',
    b: 'B', B: 'B', ㅠ: 'B',
    p: 'P', P: 'P', ㅔ: 'P'
  };
  if (pieceKeyMap[key]) {
    e.preventDefault();
    placePiece(pieceKeyMap[key]);
    return;
  }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    e.preventDefault();
    placePiece('');
  }
});

buildGrid();
buildPiecePad();
loadProgress();
renderBoard();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
</body>
</html>
