<body>

<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>260317 노리노리 - 하</h1>
<p class="subtitle">변을 눌러 도미노를 배치하세요</p>

<div class="container">
  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="bottom-buttons">
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>
  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>

  <div class="message" id="message"></div>

  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <p>• 인접한 두 칸 사이의 변을 눌러 도미노를 놓습니다.</p>
    <p>• 도미노를 다시 누르면 지울 수 있습니다.</p>
    <p>• 각 영역(굵은 테두리)에 정확히 두 칸이 색칠되어야 합니다.</p>
    <p>• 서로 다른 도미노끼리는 변을 맞댈 수 없습니다.</p>
  </div>

  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const PUZZLE_ID = '260317_01';
const SIZE = 8;
const SAVE_KEY = 'puzzle_260317_01';
const CELLS = [[0,2],[0,3],[0,4],[0,5],[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,0],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6],[2,7],[3,0],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[3,7],[4,0],[4,1],[4,2],[4,3],[4,4],[4,5],[4,6],[4,7],[5,0],[5,1],[5,2],[5,3],[5,4],[5,5],[5,6],[5,7],[6,1],[6,2],[6,3],[6,4],[6,5],[6,6],[7,2],[7,3],[7,4],[7,5]];
const REGIONS = [
  [[0,2],[0,3],[1,3]],
  [[0,4],[1,4],[2,4]],
  [[0,5],[1,5],[2,5],[3,3],[3,4],[3,5]],
  [[1,6],[2,6],[2,7],[3,6]],
  [[3,7],[4,6],[4,7],[5,7]],
  [[5,6],[6,6]],
  [[4,4],[4,5],[5,4],[5,5],[6,5]],
  [[6,4],[7,4],[7,5]],
  [[5,2],[5,3],[6,1],[6,2],[6,3],[7,2],[7,3]],
  [[4,0],[4,1],[4,2],[4,3],[5,0],[5,1]],
  [[2,0],[2,2],[2,3],[3,0],[3,1],[3,2]],
  [[1,1],[1,2],[2,1]]
];

const activeSet = new Set(CELLS.map(([r,c]) => `${r},${c}`));
const regionMap = {};
REGIONS.forEach((region, i) => { region.forEach(([r, c]) => { regionMap[`${r},${c}`] = i; }); });

let dominoes = new Set();
const cellElements = {};
const boardWrap = document.getElementById('boardWrap');

function dominoKey(k1, k2) { return k1 < k2 ? `${k1}-${k2}` : `${k2}-${k1}`; }

function dominoAt(cellKey) {
  for (const dk of dominoes) {
    const sep = dk.indexOf('-', 2);
    if (dk.substring(0, sep) === cellKey || dk.substring(sep + 1) === cellKey) return dk;
  }
  return null;
}

function createBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      const key = `${r},${c}`;
      if (!activeSet.has(key)) { cell.className = 'cell inactive'; board.appendChild(cell); continue; }
      cell.className = 'cell active';
      cell.dataset.r = r; cell.dataset.c = c;
      applyBorders(cell, r, c);
      cell.addEventListener('click', (e) => handleCellClick(e, cell, r, c, key));
      cellElements[key] = cell;
      board.appendChild(cell);
    }
  }
}

function applyBorders(cell, r, c) {
  const myRegion = regionMap[`${r},${c}`];
  const shadows = [];
  for (const [dr, dc, prop] of [[-1,0,'borderTop'],[1,0,'borderBottom'],[0,-1,'borderLeft'],[0,1,'borderRight']]) {
    const nk = `${r+dr},${c+dc}`;
    if (!activeSet.has(nk)) {
      cell.style[prop] = '2px solid #222';
      if (dr === -1) shadows.push('0 -2px 0 0 #222');
      else if (dr === 1) shadows.push('0 2px 0 0 #222');
      else if (dc === -1) shadows.push('-2px 0 0 0 #222');
      else shadows.push('2px 0 0 0 #222');
    } else if (regionMap[nk] !== myRegion) cell.style[prop] = '2px solid #222';
    else cell.style[prop] = '1px solid #aaa';
  }
  if (shadows.length) cell.style.boxShadow = shadows.join(', ');
}

function handleCellClick(e, cell, r, c, key) {
  const existing = dominoAt(key);
  if (existing) { dominoes.delete(existing); onStateChange(); return; }

  const rect = cell.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  const edges = [
    { dr: -1, dc: 0, dist: y },
    { dr: 1, dc: 0, dist: 1 - y },
    { dr: 0, dc: -1, dist: x },
    { dr: 0, dc: 1, dist: 1 - x },
  ];
  edges.sort((a, b) => a.dist - b.dist);

  const best = edges[0];
  const nk = `${r + best.dr},${c + best.dc}`;
  if (!activeSet.has(nk) || dominoAt(nk)) return;
  dominoes.add(dominoKey(key, nk));
  onStateChange();
}

function getFilledCells() {
  const filled = new Set();
  for (const dk of dominoes) {
    const sep = dk.indexOf('-', 2);
    filled.add(dk.substring(0, sep));
    filled.add(dk.substring(sep + 1));
  }
  return filled;
}

function checkAdjacentDominoes() {
  const dominoList = [...dominoes];
  const errorSet = new Set();
  for (let i = 0; i < dominoList.length; i++) {
    const sep_i = dominoList[i].indexOf('-', 2);
    const ci = [dominoList[i].substring(0, sep_i), dominoList[i].substring(sep_i + 1)];
    for (let j = i + 1; j < dominoList.length; j++) {
      const sep_j = dominoList[j].indexOf('-', 2);
      const cj = [dominoList[j].substring(0, sep_j), dominoList[j].substring(sep_j + 1)];
      let adjacent = false;
      for (const ki of ci) {
        const [ri, cci] = ki.split(',').map(Number);
        for (const kj of cj) {
          const [rj, ccj] = kj.split(',').map(Number);
          if (Math.abs(ri - rj) + Math.abs(cci - ccj) === 1) { adjacent = true; break; }
        }
        if (adjacent) break;
      }
      if (adjacent) { errorSet.add(dominoList[i]); errorSet.add(dominoList[j]); }
    }
  }
  return errorSet;
}

function renderBoard() {
  boardWrap.querySelectorAll('.domino-overlay').forEach(e => e.remove());
  const filled = getFilledCells();
  const errorDominoes = checkAdjacentDominoes();

  for (const key in cellElements) {
    const ri = regionMap[key];
    const region = REGIONS[ri];
    const count = region.filter(([r, c]) => filled.has(`${r},${c}`)).length;
    const cell = cellElements[key];
    if (count === 2) { cell.classList.add('satisfied'); } else { cell.classList.remove('satisfied'); }
  }

  for (const dk of dominoes) {
    const sep = dk.indexOf('-', 2);
    const k1 = dk.substring(0, sep), k2 = dk.substring(sep + 1);
    drawDomino(k1, k2, errorDominoes.has(dk) ? 'error' : '');
  }
}

function drawDomino(k1, k2, cls) {
  const [r1, c1] = k1.split(',').map(Number);
  const [r2, c2] = k2.split(',').map(Number);
  const p = 100 / SIZE, ins = p * 0.1;
  const el = document.createElement('div');
  el.className = `domino-overlay${cls ? ' ' + cls : ''}`;
  el.style.left = `${Math.min(c1, c2) * p + ins}%`;
  el.style.top = `${Math.min(r1, r2) * p + ins}%`;
  el.style.width = `${(Math.abs(c1 - c2) + 1) * p - 2 * ins}%`;
  el.style.height = `${(Math.abs(r1 - r2) + 1) * p - 2 * ins}%`;
  boardWrap.appendChild(el);
}

function onStateChange() { renderBoard(); saveProgress(); checkComplete(); }

function checkComplete() {
  const msg = document.getElementById('message');
  if (dominoes.size === 0) { msg.textContent = ''; return; }
  const filled = getFilledCells();

  for (const region of REGIONS) {
    if (region.filter(([r, c]) => filled.has(`${r},${c}`)).length !== 2) { msg.textContent = ''; return; }
  }

  const dominoList = [...dominoes];
  for (let i = 0; i < dominoList.length; i++) {
    const sep_i = dominoList[i].indexOf('-', 2);
    const ci = [dominoList[i].substring(0, sep_i), dominoList[i].substring(sep_i + 1)];
    for (let j = i + 1; j < dominoList.length; j++) {
      const sep_j = dominoList[j].indexOf('-', 2);
      const cj = [dominoList[j].substring(0, sep_j), dominoList[j].substring(sep_j + 1)];
      for (const ki of ci) {
        const [ri, cci] = ki.split(',').map(Number);
        for (const kj of cj) {
          const [rj, ccj] = kj.split(',').map(Number);
          if (Math.abs(ri - rj) + Math.abs(cci - ccj) === 1) { msg.textContent = ''; return; }
        }
      }
    }
  }

  msg.textContent = '축하합니다! 퍼즐을 완성했습니다!';
  recordCompletion(PUZZLE_ID);
}

function resetBoard() {
  if (dominoes.size === 0) return;
  if (!confirm('모든 도미노를 지울까요?')) return;
  dominoes = new Set();
  document.getElementById('message').textContent = '';
  onStateChange();
  resetCompletion(PUZZLE_ID);
}

function toggleRules() { document.getElementById('rulesBox').classList.toggle('open'); }

function saveProgress() { localStorage.setItem(SAVE_KEY, JSON.stringify([...dominoes])); }

function loadProgress() {
  const s = localStorage.getItem(SAVE_KEY);
  if (s) { try { const arr = JSON.parse(s); dominoes = new Set(arr.filter(dk => typeof dk === 'string' && dk.includes('-'))); } catch(e) { dominoes = new Set(); } }
}

async function handleCloudSave() {
  await saveProgressCloud(PUZZLE_ID, [...dominoes]);
}
async function handleCloudLoad() {
  const state = await loadProgressCloud(PUZZLE_ID);
  if (!state) return;
  if (Array.isArray(state)) {
    dominoes = new Set(state.filter(dk => typeof dk === 'string' && dk.includes('-')));
    onStateChange();
    saveProgress();
  }
}

createBoard(); loadProgress(); onStateChange();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>

</body>
