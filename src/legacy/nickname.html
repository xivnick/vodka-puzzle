<div class="form-wrap">
  <input class="nick-input" id="nickInput" type="text" placeholder="닉네임 입력" maxlength="20" autocomplete="off" spellcheck="false">
  <div class="nick-status" id="nickStatus"></div>
  <button class="use-btn" id="useBtn" disabled>사용하기</button>
</div>

<div class="desc-section">
  <p class="desc-item">닉네임으로 풀이 완료 기록이 저장되고 <strong>리더보드에 표시</strong>됩니다. 게스트는 기록이 저장되지 않습니다.</p>
  <p class="desc-item">닉네임을 설정하면 퍼즐 페이지에 <strong>저장하기 / 불러오기</strong> 버튼이 활성화됩니다. 풀이 진행 상태를 클라우드에 저장하고 다른 기기에서 불러올 수 있습니다.</p>
  <p class="desc-item">여러 기기에서 <strong>같은 닉네임을 사용</strong>하면 동일한 기록으로 연결됩니다.</p>
  <p class="desc-item">닉네임은 언제든 변경할 수 있지만, <strong>이전 닉네임의 기록은 새 닉네임으로 이전되지 않습니다.</strong></p>
  <p class="desc-item">닉네임은 비밀번호 없이 누구나 사용할 수 있으므로, <strong>고유한 닉네임</strong>을 사용하는 것이 좋습니다.</p>
</div>

<script>

  const nickInput = document.getElementById('nickInput');
  const statusEl  = document.getElementById('nickStatus');
  const useBtn    = document.getElementById('useBtn');

  // 현재 닉네임 미리 채우기
  const current = getNickname();
  if (current) { nickInput.value = current; useBtn.disabled = false; }

  let checkTimer = null;

  nickInput.addEventListener('input', () => {
    const name = nickInput.value.trim();
    clearTimeout(checkTimer);
    useBtn.disabled = !name;
    if (!name) { statusEl.textContent = ''; statusEl.className = 'nick-status'; return; }

    statusEl.textContent = '확인 중…';
    statusEl.className = 'nick-status checking';

    // 게스트는 DB 조회 없이 바로 경고
    if (name === GUEST_NAME) {
      statusEl.textContent = '게스트는 기록이 저장되지 않습니다.';
      statusEl.className = 'nick-status is-exists';
      return;
    }

    checkTimer = setTimeout(async () => {
      try {
        const rows = await sbSelect(
          'nicknames',
          `nickname=eq.${encodeURIComponent(name)}&select=nickname&limit=1`
        );
        if (rows.length > 0) {
          statusEl.textContent = '이미 사용 중인 닉네임입니다. 내 닉네임이라면 그대로 사용하세요.';
          statusEl.className = 'nick-status is-exists';
        } else {
          statusEl.textContent = '새로운 닉네임입니다.';
          statusEl.className = 'nick-status is-new';
        }
      } catch(e) {
        statusEl.textContent = '';
        statusEl.className = 'nick-status';
      }
    }, 500);
  });

  // 엔터키 지원
  let composing = false;
  nickInput.addEventListener('compositionstart', () => { composing = true; });
  nickInput.addEventListener('compositionend',   () => { composing = false; });
  nickInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !composing) apply();
  });

  useBtn.addEventListener('click', apply);

  async function apply() {
    const name = nickInput.value.trim();
    if (!name) return;
    useBtn.disabled = true;
    try { await registerNickname(name); }
    catch { statusEl.textContent = '닉네임을 저장하지 못했습니다. 다시 시도해 주세요.'; useBtn.disabled = false; return; }
    setNickname(name);
    // 헤더 링크 텍스트 즉시 업데이트
    const link = document.getElementById('nicknameLink');
    if (link) link.textContent = name;

    try {
      const ref = document.referrer;
      if (ref && new URL(ref).hostname === location.hostname && new URL(ref).pathname.startsWith('/puzzle/')) {
        history.back();
        return;
      }
    } catch(e) {}
    location.href = '/puzzle/';
  }
</script>
