<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>260514 도플블록 1</title>
<meta property="og:title" content="260514 도플블록 1">
<meta property="og:description" content="각 행과 열에 숫자와 막힌 칸을 배치하세요">
<meta property="og:type" content="website">
<meta property="og:url" content="https://xivnick.me/puzzle/260514_01/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .container { width: min(94vw, 560px); }
  .puzzle-wrap {
    width: min(94vw, 540px);
    display: grid;
    grid-template-columns: 42px 1fr 12px;
    grid-template-rows: 52px 1fr;
    gap: 0;
    margin-top: 18px;
  }
  .corner { grid-column: 1; grid-row: 1; }
  .top-clues {
    grid-column: 2;
    grid-row: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    align-items: end;
    padding-bottom: 8px;
  }
  .left-clues {
    grid-column: 1;
    grid-row: 2;
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    align-items: center;
    justify-items: end;
  }
  .clue {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #111;
    font-size: clamp(1.25rem, 6vw, 2.1rem);
    font-weight: 700;
    line-height: 1;
  }
  .left-clues .clue { justify-content: flex-start; }
  .board-wrap {
    grid-column: 2;
    grid-row: 2;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 2px solid #111;
    background: #fff;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    min-width: 0;
    min-height: 0;
    border-right: 1.5px solid #111;
    border-bottom: 1.5px solid #111;
    background: #fff;
    color: #111;
    font-size: clamp(1.4rem, 8vw, 2.5rem);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .cell:nth-child(6n) { border-right: none; }
  .cell:nth-child(n+31) { border-bottom: none; }
  .cell:hover:not(.block) { background: #faf8f4; }
  .cell.selected { box-shadow: inset 0 0 0 3px #d8d1bf; }
  .cell.block { background: #111; color: transparent; }
  .cell.user-value { color: #2f6f9f; }
  .cell.given { cursor: default; color: #111; background: #fff; }
  .cell.error { color: #c0392b; }
  .cell.block.error { background: #8f1f18; }
  .clue.ok { color: #5f8b52; }
  .clue.error { color: #c0392b; }
  .keypad {
    width: min(94vw, 540px);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 12px;
    touch-action: none;
  }
  .keypad button {
    height: 38px;
    border: 1.5px solid #c8c3b8;
    border-radius: 4px;
    background: #f4f1eb;
    color: #333;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: none;
  }
  .keypad button:hover { background: #e8e4da; }
  .bottom-buttons.action-row {
    width: min(94vw, 540px);
    margin-top: 8px;
  }
  .bottom-buttons.action-row button {
    width: 100%;
    height: 38px;
  }
  .message {
    min-height: 1.5em;
    margin-top: 8px;
    color: #6b9b5f;
    font-size: 0.9rem;
    text-align: center;
  }
  @media (max-width: 540px) {
    body { padding-left: 8px; padding-right: 8px; }
    h1 { font-size: 1.25rem; }
    .puzzle-wrap { grid-template-columns: 34px 1fr 6px; grid-template-rows: 46px 1fr; }
    .top-clues { padding-bottom: 7px; }
    .clue { font-size: clamp(1.15rem, 6vw, 1.8rem); }
    .keypad button,
    .bottom-buttons.action-row button { height: 36px; font-size: 0.82rem; }
  }
</style>
<link rel="stylesheet" href="/puzzle/css/common.css?v=23">
<script src="/puzzle/js/common.js?v=26"></script>
</head>
<body class="puzzle-page pad-48">
<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>
<h1>260514 도플블록 1</h1>
<p class="subtitle">각 행과 열에 숫자와 막힌 칸을 배치하세요</p>

<div class="container align-center">
  <span class="rules-toggle" onclick="toggleRules()">규칙 보기</span>
  <div class="rules-box" id="rulesBox">
    <strong>도플블록 규칙</strong><br>
    주어진 격자에 막힌 칸 또는 1부터 x까지의 숫자를 넣어 각 행과 각 열에 모든 숫자가 정확히 한번씩 등장하게 만드세요.<br>
    여기서 x란, 문제의 행의 칸 수 - 2입니다. 즉, 각 행과 각 열에는 정확히 두 개의 막힌 칸이 있을 것입니다.<br>
    격자 바깥의 숫자는 각 행/열 별로 두 막힌 칸 사이에 있는 수들의 합을 의미합니다.<br>
    몇몇 칸은 이미 채워져있을수도 있습니다.
  </div>

  <div class="puzzle-wrap">
    <div class="corner"></div>
    <div class="top-clues" id="topClues"></div>
    <div class="left-clues" id="leftClues"></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
  </div>
  <div class="keypad" id="keypad"></div>

  <div class="bottom-buttons action-row">
    <button onclick="placeValue('')">지우기</button>
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>
  <div class="cloud-btns" id="cloudBtns" style="display:none">
    <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
    <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
  </div>
  <div class="message" id="message"></div>
  <div class="lb-section">
    <div class="lb-title">푼 사람</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const PUZZLE_ID = '260514_01';
const SAVE_KEY = 'puzzle_260514_01';
const SIZE = 6;
const VALUES = ['1', '2', '3', '4'];
const TOP_CLUES = [null, 5, 4, 3, null, 2];
const LEFT_CLUES = [null, 6, 7, 8, null, 9];

let grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(''));
let selected = null;

function key(r, c) { return `${r},${c}`; }

function addPressHandler(el, handler) {
  el.addEventListener('pointerdown', event => {
    event.preventDefault();
    handler();
  });
}

function saveProgress() {
  saveLocalState(SAVE_KEY, grid);
}

function loadProgress() {
  const saved = loadLocalState(SAVE_KEY);
  if (!Array.isArray(saved) || saved.length !== SIZE) return;
  grid = saved.map(row => Array.isArray(row) && row.length === SIZE
    ? row.map(v => VALUES.includes(v) || v === 'block' ? v : '')
    : Array(SIZE).fill(''));
}

function buildClues() {
  const top = document.getElementById('topClues');
  const left = document.getElementById('leftClues');
  TOP_CLUES.forEach((clue, i) => {
    const el = document.createElement('div');
    el.className = 'clue';
    el.dataset.col = i;
    el.textContent = clue ?? '';
    top.appendChild(el);
  });
  LEFT_CLUES.forEach((clue, i) => {
    const el = document.createElement('div');
    el.className = 'clue';
    el.dataset.row = i;
    el.textContent = clue ?? '';
    left.appendChild(el);
  });
}

function buildBoard() {
  loadProgress();
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      addPressHandler(cell, () => selectCell(r, c));
      board.appendChild(cell);
    }
  }
  render();
}

function buildKeypad() {
  const pad = document.getElementById('keypad');
  [...VALUES, '■'].forEach(value => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = value;
    addPressHandler(button, () => placeValue(value === '■' ? 'block' : value));
    pad.appendChild(button);
  });
}

function selectCell(r, c) {
  selected = { r, c };
  render();
}

function placeValue(value) {
  if (!selected) return;
  grid[selected.r][selected.c] = value;
  saveProgress();
  render();
  checkComplete();
}

function lineInfo(values, clue) {
  const errors = new Set();
  const counts = new Map();
  let blockCount = 0;
  values.forEach((v, i) => {
    if (v === 'block') blockCount++;
    if (VALUES.includes(v)) counts.set(v, [...(counts.get(v) || []), i]);
  });
  counts.forEach(indices => {
    if (indices.length > 1) indices.forEach(i => errors.add(i));
  });
  if (blockCount > 2) values.forEach((v, i) => { if (v === 'block') errors.add(i); });
  const filled = values.every(Boolean);
  let clueState = '';
  if (blockCount === 2 && clue != null) {
    const blocks = values.map((v, i) => v === 'block' ? i : -1).filter(i => i >= 0).sort((a, b) => a - b);
    const between = values.slice(blocks[0] + 1, blocks[1]);
    if (between.every(v => VALUES.includes(v))) {
      const sum = between.reduce((total, v) => total + Number(v), 0);
      clueState = sum === clue ? 'ok' : 'error';
      if (sum !== clue) {
        for (let i = blocks[0] + 1; i < blocks[1]; i++) errors.add(i);
      }
    }
  }
  if (filled) {
    VALUES.forEach(n => {
      if ((counts.get(n) || []).length !== 1) {
        values.forEach((v, i) => { if (v === n || !v) errors.add(i); });
      }
    });
    if (blockCount !== 2) values.forEach((v, i) => { if (v === 'block') errors.add(i); });
  }
  return { errors, clueState, complete: filled && errors.size === 0 && (clue == null || clueState === 'ok') };
}

function getValidation() {
  const errors = new Set();
  const rowStates = [];
  const colStates = [];
  let complete = true;
  for (let r = 0; r < SIZE; r++) {
    const info = lineInfo(grid[r], LEFT_CLUES[r]);
    rowStates[r] = info.clueState;
    if (!info.complete) complete = false;
    info.errors.forEach(c => errors.add(key(r, c)));
  }
  for (let c = 0; c < SIZE; c++) {
    const column = grid.map(row => row[c]);
    const info = lineInfo(column, TOP_CLUES[c]);
    colStates[c] = info.clueState;
    if (!info.complete) complete = false;
    info.errors.forEach(r => errors.add(key(r, c)));
  }
  return { errors, rowStates, colStates, complete };
}

function render() {
  const { errors, rowStates, colStates } = getValidation();
  document.querySelectorAll('.cell').forEach(cell => {
    const r = Number(cell.dataset.r);
    const c = Number(cell.dataset.c);
    const value = grid[r][c];
    cell.textContent = VALUES.includes(value) ? value : '';
    cell.classList.toggle('block', value === 'block');
    cell.classList.toggle('user-value', VALUES.includes(value) && !cell.classList.contains('given'));
    cell.classList.toggle('selected', !!selected && selected.r === r && selected.c === c);
    cell.classList.toggle('error', errors.has(key(r, c)));
  });
  document.querySelectorAll('.left-clues .clue').forEach(el => {
    const state = rowStates[Number(el.dataset.row)];
    el.classList.toggle('ok', state === 'ok');
    el.classList.toggle('error', state === 'error');
  });
  document.querySelectorAll('.top-clues .clue').forEach(el => {
    const state = colStates[Number(el.dataset.col)];
    el.classList.toggle('ok', state === 'ok');
    el.classList.toggle('error', state === 'error');
  });
}

function checkComplete() {
  if (!getValidation().complete) return;
  document.getElementById('message').textContent = '정답입니다!';
  recordCompletion(PUZZLE_ID);
}

function resetBoard() {
  confirmPuzzleReset(PUZZLE_ID, () => {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(''));
    selected = null;
    document.getElementById('message').textContent = '';
    saveProgress();
    render();
  });
}

document.addEventListener('keydown', event => {
  if (!selected) return;
  if (VALUES.includes(event.key)) placeValue(event.key);
  else if (event.key === 'Backspace' || event.key === 'Delete') placeValue('');
  else if (event.key === '0' || event.key === ' ' || event.key.toLowerCase() === 'x') placeValue('block');
  else if (event.key === 'ArrowUp' && selected.r > 0) selectCell(selected.r - 1, selected.c);
  else if (event.key === 'ArrowDown' && selected.r < SIZE - 1) selectCell(selected.r + 1, selected.c);
  else if (event.key === 'ArrowLeft' && selected.c > 0) selectCell(selected.r, selected.c - 1);
  else if (event.key === 'ArrowRight' && selected.c < SIZE - 1) selectCell(selected.r, selected.c + 1);
});

async function handleCloudSave() {
  await saveProgressCloud(PUZZLE_ID, grid);
}

async function handleCloudLoad() {
  await loadCloudState(PUZZLE_ID, state => {
    if (!Array.isArray(state) || state.length !== SIZE) return;
    grid = state.map(row => Array.isArray(row) && row.length === SIZE
      ? row.map(v => VALUES.includes(v) || v === 'block' ? v : '')
      : Array(SIZE).fill(''));
    saveProgress();
    render();
    checkComplete();
  });
}

buildClues();
buildBoard();
buildKeypad();
initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');
</script>
</body>
</html>
