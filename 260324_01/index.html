<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>260324 필로미노</title>
<meta property="og:title" content="260324 필로미노">
<meta property="og:description" content="같은 크기의 영역끼리 닿지 않게, 숫자는 그 칸이 포함된 영역의 넓이입니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://xivnick.me/puzzle/260324_01/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #ffffff;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px 48px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #222;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 0.82rem;
    color: #888;
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.6;
  }

  .container {
    width: min(94vw, 450px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  /* ── Board ── */
  .board-wrap { border: 2.5px solid #222; }

  .board {
    display: grid;
    /* 10 cell columns interleaved with 9 separator columns */
    grid-template-columns: repeat(9, 1fr 10px) 1fr;
    grid-template-rows:    repeat(9, 1fr 10px) 1fr;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;
  }

  /* Puzzle cells */
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: min(5.5vw, 24px);
    font-weight: 700;
    color: #222;
    background: #fff;
    user-select: none;
  }
  .cell.match { color: #4a6fa5; }
  .cell.error { color: #c0392b; background: #f5d0d0; }

  /* Separator strips (clickable edges between cells) */
  .sep {
    cursor: pointer;
    position: relative;
    background: #fff;
  }
  .sep::after {
    content: '';
    position: absolute;
    background: #ccc;
    transition: background 0.1s;
    pointer-events: none;
  }

  /* Horizontal sep: full-width thin line centered vertically */
  .sep-h::after { left: 0; right: 0; height: 1px; top: 50%; transform: translateY(-50%); }
  /* Vertical sep: full-height thin line centered horizontally */
  .sep-v::after { top: 0; bottom: 0; width: 1px; left: 50%; transform: translateX(-50%); }

  .sep.active::after    { background: #222; }
  .sep-h.active::after  { height: 2.5px; }
  .sep-v.active::after  { width: 2.5px; }

  .sep:hover::after     { background: #888; }
  .sep-h:hover::after   { height: 2px; }
  .sep-v:hover::after   { width: 2px; }

  /* Corner squares (between separators — non-interactive) */
  .corner { background: #fff; }

  /* ── Buttons ── */
  .bottom-buttons {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .bottom-buttons button {
    flex: 1;
    height: 40px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid #d0ccc4;
    border-radius: 3px;
    background: #faf8f4;
    color: #777;
    cursor: pointer;
    transition: background 0.12s;
  }
  .bottom-buttons button:hover  { background: #eeebe4; color: #555; }
  .bottom-buttons button:active { transform: scale(0.97); }
  .bottom-buttons button.danger {
    border-color: #e0bfbf;
    background: #fdf5f5;
    color: #b05050;
  }
  .bottom-buttons button.danger:hover { background: #f5e0e0; color: #8c3333; }

  .lb-section { width: min(94vw, 450px); margin-top: 20px; }

  @media (max-width: 540px) {
    .bottom-buttons button { height: 10vw; font-size: 3.5vw; }
  }
</style>
</head>
<body>
<header class="site-header">
  <a class="header-back" href="/puzzle/">&lt; puzzles</a>
  <a class="header-nick-link" id="nicknameLink" href="/puzzle/nickname/"></a>
</header>

<h1>260324 필로미노</h1>
<p class="subtitle">
  변을 눌러 영역 경계를 그려보세요<br>
  숫자는 그 칸이 포함된 영역의 넓이
</p>

<div class="container">
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="bottom-buttons">
    <button class="danger" onclick="resetBoard()">초기화</button>
  </div>
</div>

<div class="cloud-btns" id="cloudBtns" style="display:none">
  <button class="cloud-btn" onclick="handleCloudSave()">저장하기</button>
  <button class="cloud-btn" onclick="handleCloudLoad()">불러오기</button>
</div>

<div class="lb-section">
  <div class="lb-title">푼 사람</div>
  <div id="leaderboard"></div>
</div>

<script src="../js/common.js?v=4"></script>
<script>
const PUZZLE_ID = '260324_01';
const SIZE = 10;

// Preset clue numbers: [row, col, value]  (0-indexed)
const PRESETS = [
  [0,1,3],[0,2,2],[0,4,4],[0,5,3],[0,7,1],[0,8,3],
  [1,0,1],[1,3,5],[1,6,4],[1,9,2],
  [2,0,3],[2,3,2],[2,6,5],[2,9,4],
  [4,0,5],[4,2,3],[4,3,3],[4,4,4],[4,6,4],[4,8,4],
  [5,1,5],[5,3,2],[5,5,2],[5,6,4],[5,7,2],[5,9,2],
  [7,0,5],[7,3,5],[7,6,3],[7,9,5],
  [8,0,1],[8,3,2],[8,6,4],[8,9,2],
  [9,1,3],[9,2,5],[9,4,3],[9,5,4],[9,7,4],[9,8,1]
];

const presetGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
for (const [r, c, v] of PRESETS) presetGrid[r][c] = v;

// rSep[r][c]: wall between row r and r+1, at column c   (r ∈ 0..8, c ∈ 0..9)
// cSep[r][c]: wall between col c and c+1, at row r      (r ∈ 0..9, c ∈ 0..8)
let rSep = Array.from({length: SIZE-1}, () => Array(SIZE).fill(false));
let cSep = Array.from({length: SIZE}, () => Array(SIZE-1).fill(false));
let hasInteracted = false;

/* ── Build DOM ── */
function buildGrid() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  // 19×19 visual grid: even indices = cells/seps, odd-odd = corners
  for (let gi = 0; gi < 2*SIZE - 1; gi++) {
    for (let gj = 0; gj < 2*SIZE - 1; gj++) {
      const div = document.createElement('div');

      if (gi % 2 === 0 && gj % 2 === 0) {
        // Puzzle cell
        const r = gi / 2, c = gj / 2;
        div.className = 'cell';
        div.dataset.r = r; div.dataset.c = c;
        if (presetGrid[r][c]) div.textContent = presetGrid[r][c];

      } else if (gi % 2 === 1 && gj % 2 === 0) {
        // Horizontal separator: between rows (gi-1)/2 and (gi+1)/2, column gj/2
        const r = (gi - 1) / 2, c = gj / 2;
        div.className = 'sep sep-h';
        div.dataset.t = 'r'; div.dataset.r = r; div.dataset.c = c;
        if (rSep[r][c]) div.classList.add('active');
        div.addEventListener('click', () => toggle('r', r, c));

      } else if (gi % 2 === 0 && gj % 2 === 1) {
        // Vertical separator: between cols (gj-1)/2 and (gj+1)/2, row gi/2
        const r = gi / 2, c = (gj - 1) / 2;
        div.className = 'sep sep-v';
        div.dataset.t = 'c'; div.dataset.r = r; div.dataset.c = c;
        if (cSep[r][c]) div.classList.add('active');
        div.addEventListener('click', () => toggle('c', r, c));

      } else {
        div.className = 'corner';
      }

      el.appendChild(div);
    }
  }
}

function toggle(t, r, c) {
  if (t === 'r') rSep[r][c] = !rSep[r][c];
  else           cSep[r][c] = !cSep[r][c];
  hasInteracted = true;
  saveProgress();
  render();
  checkComplete();
}

/* ── Region BFS ── */
function getRegions() {
  const visited  = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
  const regionOf = Array.from({length: SIZE}, () => Array(SIZE).fill(-1));
  const regions  = [];

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (!visited[r][c]) {
        const idx = regions.length;
        const cells = [], nums = [];
        const queue = [[r, c]];
        visited[r][c] = true;

        while (queue.length) {
          const [cr, cc] = queue.shift();
          cells.push([cr, cc]);
          regionOf[cr][cc] = idx;
          if (presetGrid[cr][cc]) nums.push(presetGrid[cr][cc]);

          const nbrs = [
            [cr-1, cc,  cr > 0       && rSep[cr-1][cc]],
            [cr+1, cc,  cr < SIZE-1  && rSep[cr  ][cc]],
            [cr, cc-1,  cc > 0       && cSep[cr][cc-1]],
            [cr, cc+1,  cc < SIZE-1  && cSep[cr][cc  ]],
          ];
          for (const [nr, nc, blocked] of nbrs) {
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !visited[nr][nc] && !blocked) {
              visited[nr][nc] = true;
              queue.push([nr, nc]);
            }
          }
        }
        regions.push({idx, cells, nums, size: cells.length});
      }
    }
  }
  return {regions, regionOf};
}

/* ── Color logic ── */
function computeColors() {
  const {regions, regionOf} = getRegions();

  const status = regions.map(({nums, size}) => {
    if (!nums.length) return 'normal';
    const uniq = [...new Set(nums)];
    if (uniq.length > 1 || size > uniq[0]) return 'error';
    if (size === uniq[0]) return 'match';
    return 'normal'; // still growing
  });

  // Two adjacent 'match' regions of equal size → both become 'error'
  const seen = new Set();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      for (const [nr, nc] of [[r, c+1], [r+1, c]]) {
        if (nr < SIZE && nc < SIZE) {
          const ri = regionOf[r][c], rj = regionOf[nr][nc];
          if (ri !== rj) {
            const key = ri < rj ? `${ri}-${rj}` : `${rj}-${ri}`;
            if (!seen.has(key)) {
              seen.add(key);
              if (status[ri] === 'match' && status[rj] === 'match' &&
                  regions[ri].size === regions[rj].size) {
                status[ri] = status[rj] = 'error';
              }
            }
          }
        }
      }
    }
  }

  // Only apply color to cells that have a preset number (and only after first interaction)
  const colors = Array.from({length: SIZE}, () => Array(SIZE).fill(''));
  if (!hasInteracted) return colors;
  for (const {idx, cells, nums} of regions) {
    if (!nums.length) continue;
    for (const [r, c] of cells) {
      if (presetGrid[r][c]) colors[r][c] = status[idx];
    }
  }
  return colors;
}

function render() {
  const colors = computeColors();
  const el = document.getElementById('board');

  el.querySelectorAll('.cell').forEach(cell => {
    const r = +cell.dataset.r, c = +cell.dataset.c;
    cell.className = 'cell' + (colors[r][c] ? ' ' + colors[r][c] : '');
    cell.textContent = presetGrid[r][c] || '';
  });

  el.querySelectorAll('.sep').forEach(sep => {
    const t = sep.dataset.t, r = +sep.dataset.r, c = +sep.dataset.c;
    sep.classList.toggle('active', t === 'r' ? rSep[r][c] : cSep[r][c]);
  });
}

/* ── Completion check ── */
function isSolved() {
  const {regions, regionOf} = getRegions();

  // Every numbered region must have size == its number (and only one distinct number)
  for (const {nums, size} of regions) {
    if (!nums.length) continue;
    const uniq = [...new Set(nums)];
    if (uniq.length > 1 || size !== uniq[0]) return false;
  }

  // No two adjacent regions may have the same size
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (c < SIZE-1) {
        const ri = regionOf[r][c], rj = regionOf[r][c+1];
        if (ri !== rj && regions[ri].size === regions[rj].size) return false;
      }
      if (r < SIZE-1) {
        const ri = regionOf[r][c], rj = regionOf[r+1][c];
        if (ri !== rj && regions[ri].size === regions[rj].size) return false;
      }
    }
  }
  return true;
}

function checkComplete() {
  if (isSolved()) recordCompletion(PUZZLE_ID);
}

/* ── Storage ── */
function getState() {
  return { rSep: rSep.map(row => [...row]), cSep: cSep.map(row => [...row]) };
}

function saveProgress() {
  localStorage.setItem(`puzzle_${PUZZLE_ID}`, JSON.stringify(getState()));
}

function loadProgress() {
  const raw = localStorage.getItem(`puzzle_${PUZZLE_ID}`);
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (s.rSep) { rSep = s.rSep; hasInteracted = true; }
    if (s.cSep) { cSep = s.cSep; hasInteracted = true; }
  } catch(e) {}
}

function resetBoard() {
  if (!confirm('정말 초기화하시겠습니까?')) return;
  rSep = Array.from({length: SIZE-1}, () => Array(SIZE).fill(false));
  cSep = Array.from({length: SIZE}, () => Array(SIZE-1).fill(false));
  resetCompletion(PUZZLE_ID);
  saveProgress();
  render();
}

/* ── Cloud ── */
function handleCloudSave() { saveProgressCloud(PUZZLE_ID, getState()); }
async function handleCloudLoad() {
  const s = await loadProgressCloud(PUZZLE_ID);
  if (!s) return;
  if (s.rSep) rSep = s.rSep;
  if (s.cSep) cSep = s.cSep;
  saveProgress();
  render();
  checkComplete();
}

/* ── Init ── */
loadProgress();
buildGrid();
render();

initHeader();
initCloudBtns();
renderLeaderboard(PUZZLE_ID, 'leaderboard');

window.addEventListener('pageshow', e => {
  if (e.persisted) { initHeader(); initCloudBtns(); checkComplete(); }
});
</script>
</body>
</html>
